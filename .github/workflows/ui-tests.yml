name: UI tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/zeron/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - 'scripts/*cursor-sdk*'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/test-browser-storage.py'
      - '.github/workflows/ui-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/zeron/**'
      - '.github/actions/linux-ci/**'
      - 'scripts/ci/**'
      - 'scripts/*cursor-sdk*'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/test-browser-storage.py'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Linux Rust tests: one build, one nextest run (see
  # scripts/ci/test-core.sh), including the voice protocol and transport tests
  # that need no audio stack.
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-ci
        with:
          rust-cache: core
          save-rust-cache: 'true'
      - name: Harness, engine, sync, update, doc and preview tests
        run: scripts/ci/test-core.sh
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-core-tests
