name: macOS tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'edge/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/test-browser-storage.py'
      - 'scripts/ci/run-macos-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/macos.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'edge/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/test-browser-storage.py'
      - 'scripts/ci/run-macos-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests run on the dev profile (workspace crates at opt-level 0, dependencies at 2 as configured in
  # Cargo.toml) instead of --release: a cold build is several times cheaper. No debug info is needed.
  CARGO_PROFILE_DEV_DEBUG: 0

# Every macOS job starts with `rustup update stable`: runner images are not uniform (one image may ship
# rustc 1.98.0 and another 1.98.1) and rust-cache keys include the rustc version, so a job that lands
# on an older image would otherwise miss the cache that `main` seeded.
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: filter
        with:
          script: |
            // Preserve iOS coverage for main pushes and manual runs.
            if (context.eventName !== 'pull_request') return true;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Run conservatively if the API did not return the full diff.
            if (files.length < context.payload.pull_request.changed_files) return true;
            // The app links the Rust mobile core and everything it depends on.
            const mobileCore = ['crates/mobile/', 'crates/client/', 'crates/text/', 'crates/markdown/',
              'crates/doc/', 'crates/sync/', 'crates/proto/', 'crates/rpc/', 'crates/syntax/',
              'scripts/ios/'];
            const affectsIOS = path => path?.startsWith('apps/ios/')
              || mobileCore.some(prefix => path?.startsWith(prefix))
              || path === 'Cargo.lock'
              || path === 'Cargo.toml'
              || path === 'rust-toolchain.toml'
              || path === '.github/workflows/macos.yml';
            return files.some(file => affectsIOS(file.filename)
              || affectsIOS(file.previous_filename));

  # Updater, preview, CoreText and `zeron` command-line tests. Everything is compiled once (one cargo
  # invocation, so dependencies are built once) and then run.
  macos-native:
    runs-on: macos-latest
    # A cold cache (first run, eviction, toolchain bump) takes about 32 minutes; warm is about 10.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install cargo-nextest
        run: |
          # Pinned release, verified against a checksum.
          version=0.9.146
          sha256=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-universal-apple-darwin.tar.gz"
          echo "$sha256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          # macOS 26 runners ship rustup from the system package manager, so
          # ~/.cargo/bin no longer exists. A run-scoped bin dir on PATH also
          # keeps the verified binary out of the rust-cache'd ~/.cargo.
          bin="$RUNNER_TEMP/nextest-bin"
          mkdir -p "$bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$bin" cargo-nextest
          echo "$bin" >> "$GITHUB_PATH"
      # The `zeron` binaries (`-p zeron --bins`) are compiled with the tests.
      - name: Build tests and the binaries
        run: |
          cargo nextest run --config-file scripts/ci/nextest.toml --no-run --locked \
            -p zeron-update -p zeron-preview -p zeron-text -p zeron \
            --lib --bins --tests
      - name: Updater, preview, CoreText and command-line tests
        run: |
          # zeron-text's coretext tests are macOS-only (#![cfg(target_os = "macos")]); its other
          # tests run on Linux in ios-core.
          cargo nextest run --config-file scripts/ci/nextest.toml --no-fail-fast --locked \
            -p zeron-update -p zeron-preview -p zeron-text -p zeron \
            --lib --bins --tests \
            -E 'package(zeron-update) | package(zeron-preview) | binary_id(zeron-text::coretext) | binary_id(zeron::cli)'
      - name: Record the pass (CI skips this job while its inputs stay the same)
        if: inputs.pass-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-toolchain.toml
          key: ${{ inputs.pass-key }}-macos-native

  # The iOS checks that do not need Apple tooling run on Linux: Rust mobile core tests, and "the
  # committed Swift bindings are current" (the UniFFI metadata is identical for any target, so the
  # bindings are generated from the host build of the library).
  ios-core:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Rust mobile core tests
        run: cargo test --locked -p zeron-text -p zeron-markdown -p zeron-client -p zeron-mobile
      - name: Generated Swift bindings are current
        run: |
          cargo build --locked -p zeron-mobile --lib
          cargo build --locked -p zeron-mobile --bin uniffi-bindgen --features bindgen
          target/debug/uniffi-bindgen generate --library target/debug/libzeron_mobile.so \
            --language swift --out-dir "$RUNNER_TEMP/gen" >/dev/null
          diff -u apps/ios/Zeron/Core/Generated/zeron_core.swift "$RUNNER_TEMP/gen/zeron_core.swift"
          # The simulator job links these headers instead of regenerating them.
          mkdir -p "$RUNNER_TEMP/ios-include"
          cp "$RUNNER_TEMP/gen/zeron_coreFFI.h" "$RUNNER_TEMP/ios-include/zeron_coreFFI.h"
          cp "$RUNNER_TEMP/gen/zeron_coreFFI.modulemap" "$RUNNER_TEMP/ios-include/module.modulemap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ffi-include
          path: ${{ runner.temp }}/ios-include
          retention-days: 1

  # iOS unit tests in the simulator (only when iOS or the mobile core changed, see `changes`).
  # Waiting for macos-frame-source keeps a run to two macOS runners at a time.
  # Do not boot the simulator in the background: hundreds of launchd_sim daemons starve the 3-vCPU
  # VM and slow every other step down by minutes. xcodebuild boots it when needed.
  ios-tests:
    needs: [changes, ios-core, macos-frame-source]
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select an available iPhone simulator
        run: |
          # The app targets iOS 26: use the newest Xcode 26 and the newest iOS runtime installed.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"; fi
          python3 - <<'PYTHON'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          def version(runtime):
              return [int(part) for part in runtime.split("iOS-")[-1].split("-") if part.isdigit()]
          iphones = [device for runtime, group in sorted(devices.items(), key=lambda item: version(item[0]), reverse=True)
                     if "iOS" in runtime for device in group if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator is installed")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("IOS_SIMULATOR_ID=" + iphones[0]["udid"] + "\n")
          PYTHON
      - name: Rust toolchain + iOS simulator target
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build the Rust core for the simulator
        run: |
          # Same build as scripts/ios/build-core.sh iphonesimulator; the bindings came from ios-core.
          IPHONEOS_DEPLOYMENT_TARGET=26.0 cargo build --locked -p zeron-mobile --lib --profile mobile --target aarch64-apple-ios-sim
          mkdir -p target/ios-core/iphonesimulator
          cp target/aarch64-apple-ios-sim/mobile/libzeron_mobile.a target/ios-core/iphonesimulator/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ffi-include
          path: target/ios-core/iphonesimulator/include
      - name: Run iOS unit tests
        working-directory: apps/ios
        env:
          # Reuse the core built above instead of rebuilding it in the Xcode build phase.
          ZERON_SKIP_CORE: 1
        run: |
          xcodebuild -project Zeron.xcodeproj -scheme Zeron \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            -only-testing:ZeronTests CODE_SIGNING_ALLOWED=NO test
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
