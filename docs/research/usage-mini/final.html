<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Usage mini — bản chốt</title>
<style>
  body { margin: 0; padding: 28px 32px 60px; background: #111; color: #ccc; font: 13px/1.6 "Geist", "Inter", -apple-system, system-ui, sans-serif; }
  h1 { font-size: 16px; color: #eee; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #999; max-width: 900px; }
  .grid { display: flex; gap: 22px; flex-wrap: wrap; }
  figure { margin: 0; width: 258px; }
  iframe { width: 258px; height: 500px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: #1a1a1c; display: block; }
  figcaption { margin-top: 8px; font-size: 12px; color: #aaa; }
  figcaption b { color: #eee; }
</style>
</head>
<body>
<h1>Usage mini, bản chốt (A + menu section)</h1>
<p>Đóng: bar nhỏ dưới "Local only", mỗi harness một chấm màu, hiện window xấu nhất. Bấm hàng user: menu cũ mở, section Usage nằm giữa "Stored on this device" và "Enable sync / Settings". Không có usage thì hàng giữ nguyên.</p>
<div class="grid">
  <figure><iframe src="index.html?bare&variant=a&click=menu"></iframe><figcaption><b>Đóng</b>, số thật</figcaption></figure>
  <figure><iframe src="index.html?bare&variant=a&click=menu&open=menu"></iframe><figcaption><b>Menu mở</b>, số thật</figcaption></figure>
  <figure><iframe src="index.html?bare&variant=a&click=menu&state=crit&open=menu"></iframe><figcaption><b>Critical</b> 97%: đỏ</figcaption></figure>
  <figure><iframe src="index.html?bare&variant=a&click=menu&state=none&open=menu"></iframe><figcaption><b>Chưa login</b>: menu như cũ, không có section</figcaption></figure>
</div>
</body>
</html>
