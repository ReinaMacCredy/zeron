<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zeron — model switch warning (interactive mock)</title>
<style>
  :root {
    --bg: #1c1c1e; --sidebar: #1a1a1c; --main: #202022; --pane: #1e1e20;
    --border: rgba(255,255,255,0.06);
    --text: rgba(255,255,255,0.92); --text-80: rgba(255,255,255,0.74);
    --muted: rgba(255,255,255,0.46); --muted-50: rgba(255,255,255,0.23);
    --wash-hover: rgba(255,255,255,0.05); --wash-selected: rgba(255,255,255,0.08);
    --ink-08: rgba(255,255,255,0.08);
    --accent: #7aa2f7; --accent-wash: rgba(122,162,247,0.12);
    --working: #e0af68; --done: #9ece6a; --danger: #f7768e; --warning: #e0af68; --warning-wash: rgba(224,175,104,0.10);
    --sidebar-w: 236px;
    --font-ui: "Geist", "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: #111; color: var(--text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }

  .toolbar { width: 1180px; margin: 24px auto 0; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .toolbar .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toolbar .seg button { background: transparent; border: 0; color: var(--muted); padding: 5px 10px; font: inherit; cursor: pointer; }
  .toolbar .seg button.on { background: var(--wash-selected); color: var(--text); }
  .toolbar .hint { margin-left: auto; color: var(--muted-50); }
  .toolbar .lbl { margin-left: 6px; }

  .window { position: relative; width: 1180px; height: 720px; margin: 10px auto 40px; background: var(--bg); border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-rows: 44px 1fr; }
  .titlebar { display: flex; align-items: center; height: 44px; border-bottom: 1px solid var(--border); }
  .titlebar .left { width: var(--sidebar-w); display: flex; align-items: center; gap: 8px; padding-left: 78px; color: var(--muted); font-size: 12px; }
  .tabs { flex: 1; display: flex; align-items: center; gap: 4px; padding-left: 12px; }
  .tab { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 7px; font-size: 12px; color: var(--muted); }
  .tab.active { background: var(--wash-selected); color: var(--text); }
  .tab .x { color: var(--muted-50); font-size: 11px; }

  .body { display: flex; min-height: 0; }
  .sidebar { width: var(--sidebar-w); background: var(--sidebar); display: flex; flex-direction: column; padding: 8px; gap: 2px; }
  .group-header { padding: 8px 8px 2px; font-size: 10px; font-weight: 500; color: var(--muted); }
  .row { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 8px; color: var(--text-80); }
  .row.selected { background: var(--wash-selected); color: var(--text); }
  .row .l1 { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted-50); }
  .row .l2 { font-size: 13px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .l3 { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

  .main { flex: 1; min-width: 0; background: var(--main); border-left: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
  .transcript { flex: 1; overflow-y: auto; padding: 28px 48px 12px; display: flex; flex-direction: column; align-items: center; }
  .col { width: 100%; max-width: 640px; }
  .empty { margin-top: 180px; text-align: center; color: var(--muted-50); font-size: 13px; }

  .entry { padding: 6px 0; }
  .entry.user { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble { max-width: 80%; background: rgba(255,255,255,0.08); color: var(--text); padding: 9px 14px; border-radius: 16px; font-size: 14px; line-height: 20px; }
  .assistant .md { font-size: 14px; line-height: 21px; color: var(--text); }
  .assistant .md code { font-family: var(--font-mono); font-size: 12px; background: var(--ink-08); padding: 1px 5px; border-radius: 4px; }
  .tools { font-size: 12px; color: var(--muted); margin: 6px 0; display: flex; gap: 6px; }
  .tools span { background: var(--ink-08); padding: 2px 7px; border-radius: 5px; }

  /* transcript divider row: "Model changed from A to B" (Codex-style) */
  .divider { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 13px; color: var(--muted); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .divider .lbl { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .divider svg { width: 15px; height: 15px; }
  .divider .info { position: relative; display: inline-flex; color: var(--muted-50); cursor: default; }
  .divider .info:hover { color: var(--text-80); }
  .divider .info .tip { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: 300px; text-align: center; white-space: normal;
    background: #2a2a2d; border: 1px solid rgba(255,255,255,0.10); color: var(--text-80); font-size: 13px; line-height: 19px; padding: 10px 14px; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 6; }
  .divider .info:hover .tip { opacity: 1; }
  .divider.fresh .lbl { animation: fade-in .25s ease-out; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .composer-wrap { padding: 8px 48px 16px; display: flex; justify-content: center; position: relative; }
  .composer { width: 100%; max-width: 640px; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; background: rgba(255,255,255,0.03); padding: 10px 12px 8px; position: relative; }
  .composer textarea { width: 100%; background: transparent; border: 0; outline: 0; color: var(--text); font: 14px/20px var(--font-ui); resize: none; height: 44px; }
  .composer .ctl { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
  .meter { display: inline-flex; align-items: center; gap: 5px; }
  .ring { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--accent) var(--pct), rgba(255,255,255,0.12) 0); }
  .composer .ctl .send { margin-left: auto; background: var(--accent); color: #101010; border: 0; border-radius: 8px; padding: 4px 10px; font: 500 12px var(--font-ui); }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--ink-08); padding: 3px 9px; border-radius: 999px; cursor: pointer; color: var(--text-80); }
  .chip:hover { background: var(--wash-selected); color: var(--text); }
  .chip svg { width: 12px; height: 12px; }
  .chip .caret { color: var(--muted-50); font-size: 9px; }

  /* harness/model picker: rail + list, anchored above the composer */
  .picker { position: absolute; left: 0; bottom: 100%; margin-bottom: 8px; width: 420px; display: flex; background: rgba(36,36,39,0.96); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.10); border-radius: 14px; box-shadow: 0 18px 48px rgba(0,0,0,0.5); overflow: hidden; z-index: 10; }
  .rail { width: 44px; border-right: 1px solid var(--border); padding: 8px 6px; display: flex; flex-direction: column; gap: 4px; }
  .rail .h { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font: 500 12px var(--font-mono); color: var(--muted); cursor: pointer; }
  .rail .h:hover { background: var(--wash-hover); color: var(--text); }
  .rail .h.on { background: var(--wash-selected); color: var(--text); }
  .rail .h.locked { opacity: .35; cursor: not-allowed; }
  .rail .h.locked:hover { background: transparent; color: var(--muted); }
  .list { flex: 1; padding: 8px; display: flex; flex-direction: column; }
  .list .hd { padding: 4px 8px 8px; font-size: 10px; font-weight: 500; color: var(--muted); }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--text-80); }
  .mrow:hover, .mrow.focus { background: var(--wash-selected); color: var(--text); }
  .mrow .id { font-family: var(--font-mono); font-size: 10px; color: var(--muted-50); margin-left: 2px; }
  .mrow .grow { flex: 1; }
  .mrow .kb { font-family: var(--font-mono); font-size: 10px; color: var(--muted-50); background: var(--ink-08); padding: 1px 5px; border-radius: 4px; }
  .mrow .chk { width: 14px; height: 14px; color: var(--accent); }
  .mrow .chk svg { width: 14px; height: 14px; }
  .mrow.cur { color: var(--text); }

  /* inline variant: confirm strip inside the picker list */
  .strip { margin: 8px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warning-wash); border: 1px solid rgba(224,175,104,0.25); font-size: 12px; line-height: 17px; color: var(--text-80); }
  .strip .t { display: flex; align-items: center; gap: 6px; color: var(--warning); font-weight: 500; margin-bottom: 3px; }
  .strip .t svg { width: 13px; height: 13px; }
  .strip .b { color: var(--muted); }
  .strip .acts { display: flex; gap: 8px; margin-top: 8px; }
  .strip .acts button { font: 500 12px var(--font-ui); border-radius: 7px; padding: 4px 10px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-80); }
  .strip .acts button.pri { background: var(--warning); color: #141414; border-color: transparent; }
  .strip .acts kbd { font-family: var(--font-mono); font-size: 10px; opacity: .6; margin-left: 5px; }

  /* centered modal (glass palette style) */
  .scrim { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding-top: 180px; background: rgba(0,0,0,0.28); }
  .modal { width: 520px; background: rgba(36,36,39,0.92); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.55); overflow: hidden; }
  .modal h3 { margin: 0; padding: 18px 20px 4px; font-size: 18px; font-weight: 500; color: var(--text); }
  .modal .sub { padding: 0 20px 10px; font-size: 13px; color: var(--warning); display: flex; align-items: center; gap: 6px; }
  .modal .sub svg { width: 14px; height: 14px; }
  .modal .ctx { padding: 0 20px 14px; font-size: 13px; line-height: 19px; color: var(--muted); border-bottom: 1px solid var(--border); }
  .modal .ctx b { color: var(--text-80); font-weight: 500; }
  .modal .opts { padding: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .opt:hover, .opt.focus { background: var(--wash-selected); }
  .opt .n { width: 18px; font-family: var(--font-mono); font-size: 12px; color: var(--muted-50); text-align: right; }
  .opt.focus .n { color: var(--accent); }
  .opt .t { font-size: 14px; color: var(--text); }
  .opt .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .modal .foot { display: flex; justify-content: space-between; padding: 8px 16px 10px; font-size: 11px; color: var(--muted-50); border-top: 1px solid var(--border); }
  .modal .foot kbd { font-family: var(--font-mono); background: var(--ink-08); padding: 1px 5px; border-radius: 4px; color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #242427; border: 1px solid rgba(255,255,255,0.1); color: var(--text-80); font-size: 12px; padding: 8px 12px; border-radius: 8px; opacity: 0; transition: opacity .15s; pointer-events: none; font-family: var(--font-mono); }
  .toast.on { opacity: 1; }
</style>
</head>
<body>

<div class="toolbar">
  <span>Harness:</span>
  <div class="seg" id="harness">
    <button class="on" data-v="claude">Claude</button>
    <button data-v="codex">Codex</button>
  </div>
  <span class="lbl">Chat:</span>
  <div class="seg" id="chatkind">
    <button class="on" data-v="existing">Existing (has history)</button>
    <button data-v="new">New (empty)</button>
  </div>
  <span class="lbl">Warning:</span>
  <div class="seg" id="variant">
    <button class="on" data-v="dialog">A · Confirm dialog</button>
    <button data-v="inline">B · Inline in picker</button>
  </div>
  <span class="chip" id="reset">Reset demo</span>
  <span class="hint">Click the model chip in the composer, pick another model.</span>
</div>

<div class="window">
  <div class="titlebar">
    <div class="left">All spaces</div>
    <div class="tabs"><div class="tab active"><span id="tab-title">Fix login retry loop</span><span class="x">×</span></div></div>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="group-header">zeron-fork</div>
      <div class="row selected"><div class="l1"><span>zeron-fork</span><span></span></div><div class="l2" id="side-title">Fix login retry loop</div><div class="l3">feat/auth-retry</div></div>
      <div class="row"><div class="l1"><span>zeron-fork</span><span></span></div><div class="l2">Sidebar redesign notes</div><div class="l3">main</div></div>
    </div>
    <div class="main">
      <div class="transcript" id="transcript"></div>
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="composer" placeholder="Message…"></textarea>
          <div class="ctl">
            <span class="meter"><span class="ring" id="ring" style="--pct:62%"></span><span id="pct">62%</span></span>
            <span class="chip" id="model-chip"></span>
            <button class="send">Send</button>
          </div>
          <div class="picker" id="picker" hidden></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ICON = {
  cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

const HARNESS = {
  claude: { rail: 'C', name: 'Claude', models: [
    { id: 'claude-fable-5-1', label: 'Fable 5.1' },
    { id: 'claude-opus-5', label: 'Opus 5' },
    { id: 'claude-sonnet-5', label: 'Sonnet 5' },
    { id: 'claude-haiku-4-5', label: 'Haiku 4.5' },
  ]},
  codex: { rail: 'X', name: 'Codex', models: [
    { id: 'gpt-5.6-sol', label: 'GPT-5.6 Sol' },
    { id: 'gpt-5.6-luna', label: 'GPT-5.6 Luna' },
    { id: 'gpt-5.5', label: 'GPT-5.5' },
  ]},
};

// Harness-specific body copy. Claude: the cache is the cost. Codex: the harness itself warns about
// degraded performance and auto-compaction (its own transcript tooltip wording).
const COPY = {
  claude: (from, to) => `This conversation is cached for the current model. Switching to <b>${to}</b> means the full history gets re-read on your next message.`,
  codex:  (from, to) => `Changing models mid-conversation will degrade performance. Context may automatically compact after switching to <b>${to}</b>.`,
};
const TIP = {
  claude: 'Changing models mid-conversation drops the prompt cache. The full history is re-read on the next message.',
  codex: 'Changing models mid-conversation will degrade performance. Context may automatically compact.',
};

const HISTORY = [
  { role: 'user', text: 'Fix the login retry loop in auth.rs, it retries forever on 401' },
  { role: 'assistant', md: 'The loop in <code>auth.rs:88</code> never checks the status class. I will bound it to 3 attempts and stop on 4xx.', tools: ['Read auth.rs', 'Edit auth.rs'] },
  { role: 'user', text: 'Also add a test for the 401 case' },
  { role: 'assistant', md: 'Added <code>retry_stops_on_401</code> in <code>auth_tests.rs</code>. 12 tests pass.', tools: ['Write auth_tests.rs', 'Bash cargo test'] },
  { role: 'user', text: 'what are we working on?' },
  { role: 'assistant', md: 'Bounding the auth retry loop and covering the 401 case with a test. Both landed; the branch is <code>feat/auth-retry</code>.' },
];

const seed = () => ({ harness: 'claude', chat: 'existing', variant: 'dialog', model: 0, entries: HISTORY.map(e => ({ ...e })), ctx: 62, pickerOpen: false, railHarness: null, pending: null, focus: 0 });
let S = seed();

const $ = (s) => document.querySelector(s);
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); };
const cur = () => HARNESS[S.harness].models[S.model];

function renderTranscript() {
  const t = $('#transcript'); t.innerHTML = '';
  const col = document.createElement('div'); col.className = 'col'; t.appendChild(col);
  if (S.chat === 'new') { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'New chat. Nothing sent yet, so a model change here is free: no warning, no divider.'; col.appendChild(e); }
  S.entries.forEach((e, i) => {
    if (e.role === 'divider') {
      const d = document.createElement('div'); d.className = 'divider' + (e.fresh ? ' fresh' : '');
      d.innerHTML = `<span class="lbl">${ICON.cube}<span>Model changed from ${e.from} to ${e.to}.</span><span class="info">${ICON.info}<span class="tip">${TIP[e.harness]}</span></span></span>`;
      col.appendChild(d); e.fresh = false; return;
    }
    const el = document.createElement('div'); el.className = 'entry ' + e.role;
    if (e.role === 'user') { const b = document.createElement('div'); b.className = 'bubble'; b.textContent = e.text; el.appendChild(b); }
    else {
      const m = document.createElement('div'); m.className = 'md'; m.innerHTML = e.md; el.appendChild(m);
      if (e.tools) { const tl = document.createElement('div'); tl.className = 'tools'; e.tools.forEach(x => { const s = document.createElement('span'); s.textContent = x; tl.appendChild(s); }); el.appendChild(tl); }
    }
    col.appendChild(el);
  });
  t.scrollTop = t.scrollHeight;
  $('#ring').style.setProperty('--pct', S.ctx + '%'); $('#pct').textContent = S.ctx + '%';
  $('#tab-title').textContent = $('#side-title').textContent = S.chat === 'new' ? 'New chat' : 'Fix login retry loop';
}

function renderChip() {
  const c = $('#model-chip'); const m = cur();
  c.innerHTML = `${ICON.cube}<span>${m.label}</span><span class="caret">▾</span>`;
}

function renderPicker() {
  const p = $('#picker'); p.hidden = !S.pickerOpen; if (!S.pickerOpen) return;
  const rh = S.railHarness || S.harness; const h = HARNESS[rh];
  // Existing chat: the harness rail is locked (pickers.rs harness_locked); only the model can change.
  const locked = S.chat === 'existing';
  p.innerHTML = `<div class="rail">${Object.keys(HARNESS).map(k => `<div class="h ${k === rh ? 'on' : ''} ${locked && k !== S.harness ? 'locked' : ''}" data-h="${k}" title="${locked && k !== S.harness ? 'Harness is locked for an existing chat' : HARNESS[k].name}">${HARNESS[k].rail}</div>`).join('')}</div><div class="list"><div class="hd">${h.name} · models</div></div>`;
  const list = p.querySelector('.list');
  h.models.forEach((m, i) => {
    const isCur = rh === S.harness && i === S.model;
    const r = document.createElement('div'); r.className = 'mrow' + (isCur ? ' cur' : '') + (i === S.focus ? ' focus' : '');
    r.innerHTML = `<span class="chk">${isCur ? ICON.check : ''}</span><span>${m.label}</span><span class="id">${m.id}</span><span class="grow"></span><span class="kb">⌘${i + 1}</span>`;
    r.onclick = () => choose(rh, i);
    list.appendChild(r);
  });
  if (S.pending && S.variant === 'inline') {
    const { toH, toI } = S.pending; const to = HARNESS[toH].models[toI];
    const s = document.createElement('div'); s.className = 'strip';
    s.innerHTML = `<div class="t">${ICON.warn}Next response will be slower and use more tokens</div><div class="b">${COPY[S.harness](cur().label, to.label)}</div>
      <div class="acts"><button class="pri" id="inl-yes">Switch to ${to.label}<kbd>↵</kbd></button><button id="inl-no">Keep ${cur().label}<kbd>esc</kbd></button></div>`;
    list.appendChild(s);
    s.querySelector('#inl-yes').onclick = (e) => { e.stopPropagation(); confirmSwitch(); };
    s.querySelector('#inl-no').onclick = (e) => { e.stopPropagation(); cancelSwitch(); };
  }
  p.querySelectorAll('.rail .h:not(.locked)').forEach(el => el.onclick = () => { S.railHarness = el.dataset.h; S.focus = 0; S.pending = null; renderPicker(); });
}

function render() { renderTranscript(); renderChip(); renderPicker(); }

// ---- actions ----
function choose(h, i) {
  if (h === S.harness && i === S.model) { closePicker(); return; }
  const hasHistory = S.chat === 'existing' && S.entries.some(e => e.role !== 'divider');
  if (!hasHistory) { applySwitch(h, i, false); return; }
  S.pending = { toH: h, toI: i };
  if (S.variant === 'dialog') openDialog(); else { S.focus = i; renderPicker(); }
}

function applySwitch(h, i, warned) {
  const from = cur(); const to = HARNESS[h].models[i];
  const crossHarness = h !== S.harness;
  if (crossHarness && S.chat === 'existing') return;
  S.harness = h; S.model = i; S.railHarness = null; S.pending = null;
  if (warned) S.entries.push({ role: 'divider', from: from.label, to: to.label, harness: h, fresh: true });
  // The picker card stays open after a pick (pickers.rs:1490); only the dialog variant closes it,
  // since the scrim already took focus away.
  if (S.variant === 'dialog' && warned) closePicker();
  render();
  const call = crossHarness ? `setChatConfig { harness: "${h}", model: "${to.id}" }` : `setChatConfig { model: "${to.id}" }`;
  toast(call + (warned ? '  → transcript row: model_changed' : ''));
}

function confirmSwitch() { const p = S.pending; if (!p) return; closeDialog(); applySwitch(p.toH, p.toI, true); }
function cancelSwitch() { S.pending = null; closeDialog(); S.focus = S.model; renderPicker(); }

function openDialog() {
  closeDialog();
  const to = HARNESS[S.pending.toH].models[S.pending.toI];
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<h3>Switch model?</h3>
    <div class="sub">${ICON.clock}Your next response will be slower and use more tokens</div>
    <div class="ctx">${COPY[S.harness](cur().label, to.label)}</div>
    <div class="opts">
      <div class="opt focus" data-k="yes"><span class="n">1.</span><div><div class="t">Yes, switch to ${to.label}</div><div class="d">Applies to this chat only. The change is marked in the transcript.</div></div></div>
      <div class="opt" data-k="no"><span class="n">2.</span><div><div class="t">No, go back</div><div class="d">Keep ${cur().label} for this chat.</div></div></div>
    </div>
    <div class="foot"><span><kbd>1</kbd> <kbd>2</kbd> or <kbd>↑</kbd> <kbd>↓</kbd> choose · <kbd>↵</kbd> confirm</span><span><kbd>esc</kbd> cancel</span></div>`;
  m.querySelectorAll('.opt').forEach(o => { o.onclick = () => o.dataset.k === 'yes' ? confirmSwitch() : cancelSwitch(); o.onmouseenter = () => { m.querySelectorAll('.opt').forEach(x => x.classList.remove('focus')); o.classList.add('focus'); }; });
  scrim.appendChild(m); scrim.onclick = (x) => { if (x.target === scrim) cancelSwitch(); };
  $('.window').appendChild(scrim);
}
function closeDialog() { document.querySelectorAll('.scrim').forEach(x => x.remove()); }

function openPicker() { S.pickerOpen = true; S.railHarness = null; S.focus = S.model; renderPicker(); }
function closePicker() { S.pickerOpen = false; S.pending = null; closeDialog(); renderPicker(); }

$('#model-chip').onclick = (e) => { e.stopPropagation(); S.pickerOpen ? closePicker() : openPicker(); };
document.addEventListener('click', (e) => { if (S.pickerOpen && !$('#picker').contains(e.target) && !$('.scrim')) closePicker(); });

document.addEventListener('keydown', (e) => {
  const dlg = $('.scrim');
  if (dlg) {
    const opts = [...dlg.querySelectorAll('.opt')]; let k = opts.findIndex(o => o.classList.contains('focus'));
    if (e.key === 'Escape' || e.key === '2') { cancelSwitch(); }
    else if (e.key === '1') { confirmSwitch(); }
    else if (e.key === 'Enter') { opts[k].dataset.k === 'yes' ? confirmSwitch() : cancelSwitch(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { k = (k + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length; opts.forEach(o => o.classList.remove('focus')); opts[k].classList.add('focus'); }
    e.preventDefault(); return;
  }
  if (!S.pickerOpen) return;
  const rh = S.railHarness || S.harness; const n = HARNESS[rh].models.length;
  if (e.key === 'Escape') { S.pending ? cancelSwitch() : closePicker(); }
  else if (e.key === 'Enter') { S.pending ? confirmSwitch() : choose(rh, S.focus); }
  else if (S.pending) { return; }
  else if (e.key === 'ArrowDown') { S.focus = (S.focus + 1) % n; renderPicker(); }
  else if (e.key === 'ArrowUp') { S.focus = (S.focus + n - 1) % n; renderPicker(); }
  else if (e.metaKey && /^[1-9]$/.test(e.key) && +e.key <= n) { choose(rh, +e.key - 1); e.preventDefault(); }
});

function seg(id, key, after) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id} button`).forEach(x => x.classList.remove('on')); b.classList.add('on');
    S[key] = b.dataset.v; if (after) after(); closePicker(); render();
  });
}
seg('harness', 'harness', () => { S.model = 0; S.entries = S.entries.filter(e => e.role !== 'divider'); });
seg('chatkind', 'chat', () => { S.entries = S.chat === 'new' ? [] : HISTORY.map(e => ({ ...e })); S.ctx = S.chat === 'new' ? 0 : 62; });
seg('variant', 'variant');
$('#reset').onclick = () => { S = seed(); document.querySelectorAll('.toolbar .seg').forEach(g => g.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === 0))); closePicker(); render(); };

render();
</script>
</body>
</html>
