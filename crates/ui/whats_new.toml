# What's New entries, one per release. Images live in assets/whats_new/ and
# must be listed in crates/docs/src/images.rs IMAGES. Order does not matter.

[[entry]]
version = "0.2.129"
date = "Oct 29"
hero = "claude-config-panel.jpg"
hero_visual = "claude-config"

[[entry.features]]
id = "playbooks"
title = "Playbooks: start a chat from a saved recipe, Triage built in"
description = "A playbook is a markdown recipe your agent follows. Pick one in Cmd+K or Settings > Playbooks and a new chat opens with it linked in the composer and its question as the headline; add your request, pick any agent and send. Triage an issue is built in: it writes this Mac's Zeron facts, clones Zeron's source for your version, and has your agent debug the problem and draft a GitHub issue, asking before it fixes, restarts or posts anything."
details = "Write your own with New playbook in Settings > Playbooks, or keep them with a project in its .zeron/playbooks folder. When the app will not start, run zeron triage in a terminal. Playbooks are not in the iPhone palette yet."
image = "playbooks-triage.jpg"

[[entry.features]]
id = "claude-config"
title = "Claude Code settings inside the chat"
description = "Type /config in a Claude Code chat and its settings open over the chat, with Status, Config, Usage and Stats tabs. Search or filter the list and change a setting in place. Closing leaves a row with what changed and Reopen. On iPhone it opens as a sheet."
image = "ios-claude-config.jpg"
visual = "claude-config"

[[entry.features]]
id = "settings-updates"
title = "Settings grouped, with an Updates page"
description = "Settings opens as a panel over the app. Its pages sit in groups (Agents, Code, Connections), the header names the page and holds its actions, and a new Chat page holds the composer and transcript options. Settings > Updates shows this Mac's version and Automatic updates, each agent CLI with its update policy and Update all, and every device's version. Update everything in its header updates Zeron and this Mac's agents in one go."
details = "Delegation depth, Delegated tasks per chat and In a chat, Mission Control moved to a Delegation section at the bottom of Routing. Providers now points to Updates for agent update policies."
image = "settings-updates.jpg"
visual = "settings-updates"

[[entry.features]]
id = "claude-command-cards"
title = "Claude Code commands answer with cards"
description = "/context, /usage, /model and /mcp in a Claude Code chat answer with a card, even while the agent is replying, without starting a turn. Commands that only run in Claude Code's terminal say so, and the / list tags them Terminal at the bottom. The same cards show on iPhone."
details = "/context shows what fills the context, with Compact now. A card shows a running row until its answer replaces it, and offers Retry if it fails. /hooks opens settings.json and /export saves the chat as Markdown."
image = "claude-context-card.jpg"
visual = "claude-command-cards"

[[entry.features]]
id = "compaction-card"
title = "One card for each compaction"
description = "When a chat compacts, one card follows it: a small model checks whether to compact, then its verdict and reason, the progress, and the tokens before and after. Open the card to read the summary the agent wrote and what it carried over word for word."
visual = "compaction-card"

[[entry.features]]
id = "compact-ahead"
title = "Compact ahead of time (Experimental)"
description = "Turn on Compact ahead of time in Settings > General, under Compact new tasks. A chat past the check compacts as soon as a turn ends instead of when you send: Claude compacts in place and a message you send meanwhile waits for it, and Codex compacts a copy in the background and swaps it in at the next pause. Off by default."
visual = "compact-ahead"

[[entry.features]]
id = "working-now-tree"
title = "What each chat is still running"
description = "The Working now card on Home lists each chat's subagents, delegated chats and shells under it, and keeps a chat whose turn is done while they still run. Click a subagent or shell line to open the chat with its agents or shells showing."
image = "home-widgets-grid.jpg"
visual = "working-now-tree"

[[entry.features]]
id = "phone-slash-popup"
title = "The / and $ lists on iPhone"
description = "Type / or $ in the iPhone composer for the same command and skill lists as the Mac, for every agent, with Zeron's own commands in the list too."
image = "ios-slash-popup.jpg"
visual = "phone-slash-popup"

[[entry.features]]
id = "phone-subagents-pill"
title = "Subagents above the iPhone composer"
description = "When a chat runs subagents or shells, a pill above the iPhone composer counts them. Tap it for a roster card where you stop a run or open its output."
image = "ios-agents-pill.jpg"
visual = "phone-subagents-pill"

[[entry.features]]
id = "phone-chat-background"
title = "Chat backgrounds on iPhone, synced with your Mac"
description = "Settings > Wallpaper on iPhone has the Mac's chat background controls: Placement, Opacity, Blur and Scrim. Turn on Sync with Mac and the phone follows that Mac's artwork and settings."
image = "ios-chat-background.jpg"
visual = "phone-chat-background"

[[entry.features]]
id = "task-mentions"
title = "Mention a task with @"
description = "Type @ in the composer and a Tasks group lists your open tasks next to Threads; type @task and a space to list only tasks. A picked task shows as its title with its status circle, and the agent gets a link it reads with the tasks tool. Click the mention to open the task."
visual = "task-mentions"

[[entry.features]]
id = "gather-tasks"
title = "Several tasks in one thread"
description = "Select tasks with Cmd-click, Shift-click or the box left of a row, then Start in one thread: one chat gets a single message listing them in order, and a card pinned at the top of the chat ticks each task off as the agent marks it done. Add to thread hands them to a chat you already have."
visual = "gather-tasks"

[[entry.improvements]]
text = "The update button in the rail moves: an arrow drops into the tray while the update downloads, then the button checks and turns into restart."
visual = "rail-update"

[[entry.improvements]]
text = "Drag a task by the grip that appears left of its row: the row lifts and follows the pointer, the others slide apart to show where it lands, and Escape sends it back. Selected tasks move together."
visual = "task-drag"

[[entry.improvements]]
text = "Project Actions an agent adds or changes show at once in the sidecar, the toolbar menu and Cmd+K, without reopening the chat."

[[entry.improvements]]
text = "The chat wallpaper shows through the titlebar and the active folder tab, and the tab opens into the card with no line."

[[entry.improvements]]
text = "The Help menu no longer has a Mission Control intro row."

[[entry.improvements]]
text = "HTML pages open on iPhone: the card and the sheet show that a page is loading, and offer Retry when it fails. Pages with images load faster."

[[entry.improvements]]
text = "On iPhone, the minimized tab bar keeps the voice button inside its capsule, and the status sits centered when the title is hidden."

[[entry.improvements]]
text = "On iPhone, the photo grid reopens with the photos you attached picked; deselect one to take it out of the composer."

[[entry.improvements]]
text = "On iPhone, Settings keeps its large title as you scroll, under a soft blurred edge."

[[entry.improvements]]
text = "Closing a device in the Device panel no longer crashes Zeron."

[[entry.improvements]]
text = "A quieter look: neutral inline code, lighter icons, sidebar rows with branch and diff on one line, and shelves that always show their count."

[[entry.improvements]]
text = "New chat asks \"What should we build in\" your project, with the machine and permissions under the composer; a chat shows its permissions only when they are not Full access, and the model picker has a Permissions row."

[[entry.improvements]]
text = "Zeron's tools take about half the agent context they did: 31 tools instead of 38, shorter descriptions, and long references behind the docs tool, about 9K tokens of tool text instead of 17K."

[[entry]]
version = "0.2.120"
date = "Oct 24"
hero = "providers-muse.jpg"

[[entry.features]]
id = "no-send-cap"
title = "No cap on an agent's messages to other chats"
description = "An agent can message chats, start new ones, stop them and answer their questions as often as the work needs. Before, a long-running agent went quiet toward other chats after 16 of these."

[[entry.features]]
id = "upstream-0-2-120"
title = "From upstream Zeron"
description = "Muse Code joins the agents in Settings > Providers. Claude logins stay signed in, a crash or stalled run on any agent is caught and recovered, and an agent CLI release known not to work with Zeron is held back, with the reason on its version line."
details = "A failed agent update offers Retry update. Settings > General has a Git section with Credit Zeron in commits, which adds zeronsh[bot] as a co-author to agents' commits on that device; it is off by default. In Zeron Cloud, agents' commits are authored by you with zeronsh[bot] as a co-author. On iPhone, folding and unfolding a foldable iPhone keeps the open session, and Providers no longer crashes with no device to pick. Upstream's iPhone bottom bar is not taken: the iPhone keeps its tab bar."

[[entry]]
version = "0.2.118"
date = "Oct 23"
hero = "tasks-card.jpg"
hero_visual = "tasks-home"

[[entry.features]]
id = "tasks-replace-mission-control"
title = "Tasks takes over from Mission Control"
description = "Every task and mission now opens as a task page, with a Plan first switch that has the lead plan before it works. All, Missions, Trees and Needs you chips sort the list."
image = "tasks-card.jpg"
visual = "tasks-home"

[[entry.features]]
id = "mission-tabs"
title = "A mission's tabs travel together"
description = "A mission's tabs gather into one group in the titlebar, and the selected tab in a group stands out like a folder tab."
visual = "mission-tabs"

[[entry.features]]
id = "sidebar-mission-row"
title = "A mission on one sidebar row"
description = "A mission's sidebar row carries a progress ring and its live steps, then folds the rest into N more steps."
image = "mission-control-strip.jpg"
visual = "sidebar-mission"

[[entry.features]]
id = "supervisor-conversation"
title = "The Supervisor's conversation over its feed"
description = "Open Conversation on the Supervisor page and it opens over the feed. Mention a thread to the Supervisor and it watches that thread's tree; watched trees show an eye."
image = "supervisor-feed.jpg"
visual = "supervisor-conversation"

[[entry.features]]
id = "spine-wide"
title = "Room for a Spec or Overview"
description = "The spine widens when you open a step's Spec or the mission's Overview."

[[entry.features]]
id = "stopped-subagents"
title = "Stop means stopped"
description = "A subagent you stop reads Stopped instead of Done or Failed, and a Stop that leaves sub-agents running no longer leaves a working row."

[[entry.features]]
id = "ui-driver-tools"
title = "A UI driver group in Settings > Tools"
description = "ui_driver and ui_driver_drive sit in a UI driver group of their own, so you can switch them for your agents in one place."
image = "agent-tools-settings.jpg"

[[entry.features]]
id = "ios-composer"
title = "The composer on iPhone"
description = "The composer on iPhone has the chips you know from the Mac: Start mission, the model with your agent profiles, effort, the permission mode and how full the context is. Tap the context chip for Context and stats."
image = "ios-composer-menus.jpg"
details = "Type / for commands, $ for skills and @ to mention a thread or a file. Touch and hold send to queue, steer or stop and send. The session's … menu has Agents, New sidechat, Hand off thread and Compact Context. The + card attaches photos, files or a pasted image, and a long paste becomes a Pasted text tile."

[[entry.features]]
id = "ios-tasks"
title = "Tasks and missions on iPhone"
description = "A new Tasks tab lists your missions and tasks from every Mac, with the Supervisor card on top. Tap a mission for its Mission page: the plan with its cost estimate, Approve and run, and each step with its model."
image = "ios-tasks.jpg"
details = "Tap + for a new task, with Plan first to have a lead plan it. A task's sheet starts it in a new chat or hands it to a thread you have. On a Mission page you edit the steps, open a step's thread, retry or skip it, and read the Lead brief. A thread in a mission shows a strip that opens its Mission page."

[[entry.features]]
id = "ios-supervisor-sessions"
title = "The Supervisor and the sessions list on iPhone"
description = "Tap the Supervisor card on Tasks to see each Mac's Supervisor: stop, resume or start it, open its conversation, turn on Watch everything, and set its authority. The Sessions tab organizes by device or project, sorts with Active first, and nests step threads under their lead."
image = "ios-supervisor.jpg"
details = "Touch and hold a row for a preview, and a section header to move it up or down. Rows name background work such as 1 shell, and carry each agent's mark."

[[entry.features]]
id = "ios-pull-requests-git"
title = "Pull requests and Git on iPhone"
description = "The Pull requests button on the Sessions bar opens your pull requests on a Mac. Read a pull request's Summary, Code and Activity, comment and review, merge after a confirm, or hand it to an agent."
image = "ios-git.jpg"
details = "The Git side shows a checkout's working tree and history: stage and unstage files, commit with Write with AI, pull, push after a confirm, and copy a commit's SHA. Pull request links in a transcript open in the app."

[[entry.features]]
id = "ios-mac-settings"
title = "Your Mac's settings on iPhone"
description = "Settings > Devices > your Mac opens its accounts and usage, providers, agent profiles, routing, tools and limits. Add a provider instance, search the ACP Registry, or edit a profile from the phone."
image = "ios-providers.jpg"
details = "Settings > Help opens What's New and these Docs on the phone, and a card shows what is new after an update. Chat background shows your wallpaper behind open conversations."

[[entry.features]]
id = "ios-computer-use"
title = "Computer use, terminals and actions on iPhone"
description = "When an agent wants to use an app on a Mac, answer its request on the phone. A still preview shows the Mac's screen while it works, and Stop Computer Use in the session's … menu stops it for that chat."
image = "ios-computer-use.jpg"
details = "Settings > Devices > your Mac > Stop computer use stops every chat on that Mac. Terminal in the session's … menu shows the chat's terminals, and Project Actions runs the project's actions on the Mac."

[[entry.features]]
id = "ios-transcript"
title = "Fork, rewind and session info on iPhone"
description = "Touch and hold a reply to Fork chat from here, or one of your messages to Rewind to here. Session Info in the … menu shows the account's usage and the chat's sources."
image = "ios-transcript-branch.jpg"
details = "Settled turns fold under Worked for, delegate chips show the agent, model and route and open the child thread, and a usage limit card offers to switch now. A skill's name opens its SKILL.md."

[[entry.features]]
id = "upstream-0-2-118"
title = "From upstream Zeron"
description = "First-run setup for new installs, a background engine that keeps sessions running after you quit the app, and desktop notifications posted by the engine. Error cards say when an agent is signed out or out of usage and offer Log in, Claude sign-in falls back to its credentials file when the Keychain refuses, and long transcripts no longer drop the engine connection."
details = "Zeron Cloud and Billing pages appear for accounts that are offered Cloud. Your existing provider switch stays: the model picker keeps the fork's confirm dialog instead of upstream's in-picker switch. On iPhone, delete a session from the list or its … menu, a Log in button on an error card signs that agent in, and the composer sits right on foldable phones; the iPhone keeps the tab bar and model menu shown above."

[[entry]]
version = "0.2.114"
date = "Oct 20"
hero = "mission-control.jpg"

[[entry.features]]
id = "mission-control"
title = "Tasks follow every mission and agent tree"
description = "Tasks lists every chat that started other agents beside your tasks, with Missions, Trees and Needs you chips and who asks you at any depth. Add a plan to any task or chat and its lead breaks the work into steps you approve, edit and follow, each on its own thread."
image = "mission-control.jpg"
details = "Turn on Plan first on a task's card, press Shift+Tab in the composer, or click Add plan on a chat you already have; the threads it started show as Outside the plan. A mission's tabs gather into one group in the titlebar, and the Missions widget on Home tracks every mission."

[[entry.features]]
id = "supervisor"
title = "A Supervisor that watches your missions and trees"
description = "It wakes when a step fails, a thread asks, or two missions want the same port, and brings you only what needs you. Click Watch on any tree to add it, or turn on Watch everything."
image = "supervisor.jpg"
details = "Each mission's decisions form one sheet: pick your answers and one Send takes them all to the lead. Behind the gear, Decide for me lets it answer and approve plans for you, and a second switch lets it change a mission's goal or spend."

[[entry.features]]
id = "add-provider"
title = "Add any provider, or an agent from the ACP registry"
description = "Run several accounts of one agent side by side, or add Amp, Auggie and other ACP agents in a few clicks."
image = "add-provider.jpg"
details = "Claude, Codex and Pi instances can sign in to a home of their own, and every instance gets its own tab in the model picker."

[[entry.features]]
id = "topic-compaction"
title = "Compaction that knows when a new task starts"
description = "A classifier reads each message and compacts first when you change topic. Use your agent's model, or TypeSafe's Jev classifier for about a second and a fraction of a cent."
details = "Agents can compact themselves, and a switch keeps missions out. Asking to commit, push or merge work that just finished runs it at once instead of compacting first."

[[entry.features]]
id = "supervisor-stalls"
title = "The Supervisor notices work that stalled"
description = "In what it watches, it wakes when a question waits 20 minutes, a finished turn leaves files uncommitted or a branch unmerged, a thread stays idle after its limit reset or a lost report, or a merge is held back by another chat's files."

[[entry.features]]
id = "child-report-back"
title = "Child agents report back with their answer"
description = "When a delegated thread or a step finishes, the wake quotes its reply, and steps that finish together arrive as one message. When you write to a running child yourself, its parent hears what you said."

[[entry.features]]
id = "in-app-docs"
title = "Docs and release notes inside the app"
description = "The ? on the rail opens recent releases, the full changelog, keybindings, and Docs articles for every feature."

[[entry.features]]
id = "plan-steps-edit"
title = "Plan steps you can drag, edit and illustrate"
description = "Drag unstarted steps into a new order, right-click a step for its actions, and edit it in place. Paste images into a step, the overview or a Tasks board task, and the agent that runs it gets them."

[[entry.features]]
id = "mission-tree"
title = "Spine, Outline and Timeline"
description = "A tree's page shows its threads at any depth as cards around a spine, as an outline with the selected thread live beside it, or as a timeline of who ran when and who waited on whom. New threads rise in live."
image = "mission-tree.jpg"
details = "The lead's strip and the Supervisor's cards use the same tree. A step with no thread yet opens Mission Control on that step."

[[entry.features]]
id = "task-card-context"
title = "Start a task where it belongs"
description = "A task's card starts it in a new chat, hands it to an existing thread, or runs it as a mission. Give a mission up to five chats to read, and its lead reads them before it plans."
image = "task-card-context.jpg"

[[entry.features]]
id = "fold-mission-threads"
title = "Fold a mission's threads in the sidebar"
description = "Collapse a lead's step threads under its row; it still shows how many steps it has and the most pressing state among them: asking you, failed, or running."

[[entry.features]]
id = "smaller-things-0-2-114"
title = "Smaller things"
description = "Pastes of 5,000 characters or more become a Pasted text chip you can preview, skill chips open their SKILL.md, and you can annotate a browser page for your agent. Running steps shimmer, a step thread's images show in the live pane and split view, and a rewritten plan keeps its steps' images."

[[entry.features]]
id = "upstream-0-2-114"
title = "From upstream Zeron"
description = "LaTeX math in messages with a choice of math fonts, sidebar sections you can reorder by dragging their header, OpenCode question forms, and model defaults for Cursor Plus accounts."

[[entry]]
version = "0.2.113"
date = "Oct 17"
hero = "inbox.jpg"

[[entry.features]]
id = "inbox-page"
title = "An Inbox that starts your day"
description = "The rail opens an Inbox with what needs you, today's tasks, how your day is going, and how much plan is left."
image = "inbox.jpg"
details = "The sidebar Inbox gets Working and Settled shelves under a collapsible header, and a row hover card shows a session at a glance."

[[entry.features]]
id = "tasks-page"
title = "Tasks, as a list or a Kanban board"
description = "Plan work on the new Tasks page, then press Start to run a task with the canvas harness and model."
image = "kanban.jpg"
details = "Toggle List and Kanban from the titlebar. The rail shows a Needs you badge when a task is waiting on you."

[[entry.features]]
id = "btw-sidechat"
title = "Ask on the side with /btw"
description = "Side questions open inline in the main composer, so the thread keeps working while you ask. Toggle it with Cmd+;."

[[entry.features]]
id = "continue-in-new-thread"
title = "Continue in a new thread with any agent"
description = "The handoff menu lists every agent. The new thread starts from the source's handoff packet, and one divider names both sides."

[[entry.features]]
id = "idle-compaction"
title = "Long idle chats compact before the cache expires"
description = "Zeron compacts a long idle Claude chat before its one-hour prompt cache runs out, so the next turn starts cheap. Switch it off in Settings > General."

[[entry.features]]
id = "upstream-0-2-113"
title = "From upstream Zeron"
description = "Agents can show interactive native visuals, embedded browser sessions survive restarts, the file tree selects several entries, and worktree locations can be set per device."

[[entry]]
version = "0.2.112"
date = "Oct 14"

[[entry.features]]
id = "usage-page"
title = "Usage page"
description = "Plan limits from every agent account, plus token spend from the chats on this device, priced at API rates."
image = "usage.jpg"

[[entry.features]]
id = "review-chip"
title = "Review your changes from the composer"
description = "The Review chip runs a fresh reviewer and shows its findings as inline cards with Fix and Dismiss."
details = "Pick the reviewer per chat or in Settings > Code review, with its own thinking level and review instructions."

[[entry.features]]
id = "git-commit-panel"
title = "A faster Git commit panel"
description = "Commit details and file diffs scroll smoothly on large commits, and the panel resizes from its edge."

[[entry.features]]
id = "upstream-0-2-112"
title = "From upstream Zeron"
description = "Mouse back and forward buttons walk the route history, and files dropped from any folder attach on macOS."
