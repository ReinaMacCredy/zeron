# What's New entries, one per release. Images live in assets/whats_new/ and
# must be listed in crates/docs/src/images.rs IMAGES. Order does not matter.

[[entry]]
version = "0.3.19"
date = "Nov 25"

[[entry.features]]
id = "tab-notch"
title = "Tabs sit in a notch, pin as tiles, and show on the rail"
description = "The top of the chat card has a notch that holds the session tabs, with Back, Forward and New tab in its left corner and the chat's controls in the right one. Right-click a tab and choose Pin tab to keep it as a small tile at the head of the tabs. The app rail shows a mark for each open chat; the arrow above them hides them and shows their count."
details = "A hovered tab also shows a pin button between its tick and its close button, and a hovered tile an unpin button at its corner. A pinned tab stays until you unpin it: Cmd+W, a middle-click and the Close commands leave it. Pinning a tab is separate from Pin chat in the sidebar. New chat tabs have no mark on the rail. A chat waiting on background work shows a short running track in place of its dot."
visual = "tab-notch"

[[entry.improvements]]
text = "The Waiting pill says what waits: 1 question waiting, 2 approvals waiting, 1 plan waiting, or 3 waiting for you when the kinds differ. A new one from another chat opens the pill out for a few seconds with the chat that asks and what it asks, then folds back."
visual = "waiting-reveal"

[[entry.improvements]]
text = "Ctrl+Tab, set to cycle the tabs, goes through the open tabs most recently used first, as Cmd+Tab does: a quick press goes back to the tab you used before."

[[entry.improvements]]
text = "A reply's files are one list, with their folder, their count and Reveal in Finder at its head. Click a line to open the file in the right pane; hover it for Quick look, which shows an HTML file as its page and a Markdown file as it reads, and for Open in browser on an HTML file; Show all under a long file shows the rest of it there. Words ending in a colon followed by whole paths show the words, then the files as a list, and a whole path to a file among a reply's words is a link that opens it. The separate Open in card under a reply is gone: a page linked in the reply's words has Open in browser in its right-click menu."

[[entry.improvements]]
text = "Fixed: in a chat with no project, an HTML file showed a blank page in the Files tab, and Reveal in Finder and Open in browser on its files failed."

[[entry.improvements]]
text = "Fixed: a compaction's clock started again from zero when you left its chat and came back; the Working pill's rows could stop following their threads after a quick change of the threads it shows."

[[entry]]
version = "0.3.18"
date = "Nov 24"
hero = "visuals-in-reply.jpg"

[[entry.features]]
id = "bots"
title = "Bots: agents that keep their own chat, memory and inbox"
description = "A Bot is a pinned lead chat with its own notes, Inbox cards, task board and schedules. The Zeron Bot template swaps the sidebar for Bots, Needs you, Review and Sessions; the + button starts a Bot from a goal or a template."
details = "A Bot's card opens over the window with Open Bot, Dismiss and Approve. Agents reach the same data through the bot_memory, bot_inbox, bot_board and bot_schedule tools. View > Use Zeron v3 switches back."

[[entry.features]]
id = "visuals-in-reply"
title = "Visuals sit in the reply, and you can answer through them"
description = "A chart, table or diagram an agent shows now draws in place in its reply, in a frame with its title, Reset and a caption. Visuals can carry a text field, a select, a disclosure and a quiz, keep their state across a restart, and send your press back to the agent."
details = "A chart opens its data table. A visual still being built shows as a pending row."

[[entry.features]]
id = "ask-card"
title = "An agent's question draws in the reply"
description = "A single choice question from an agent appears as a card or quick chips inside the reply, with a note under each option and a Recommended mark. Approvals gain Request changes."
details = "A question nobody answered in 25 minutes stays open while the chat is idle and closes when a new turn starts. What you were typing is set aside while the question is open and comes back afterwards."

[[entry.features]]
id = "python-run"
title = "Run a Python block from a reply"
description = "A python block in a reply has a Run button. It runs in a sandbox with no network, writes only to a scratch folder and is stopped after 10 seconds. Its output, figures and status sit under the block and survive a restart."

[[entry.features]]
id = "file-cards"
title = "Files named in a reply show as cards"
description = "A paragraph that only names files draws as cards. Press one to preview the head of the file, with Open in Files panel and Reveal in Finder. A file that has gone says so."

[[entry.improvements]]
text = "Zeron follows upstream 0.3.18: Antigravity runs on Google's unified CLI with a paste-code sign-in, Cloud side chats group under one Cloud header, submenus keep open while the pointer crosses to them, and list rows share one gap."

[[entry.improvements]]
text = "A Stop reaches the turn it names even when that turn's reply or your earlier sends landed first. A send held for the stopped turn stays in the paused queue and runs after your next message."

[[entry.improvements]]
text = "Text selected on a page an agent rendered, opened out or served from a server, can be attached as a mention."

[[entry.improvements]]
text = "The Side chat tab above the composer is gone; side chats and their shortcut are unchanged."

[[entry.improvements]]
text = "Fixed: a queued message could be sent before its attachments finished uploading and pause the queue for good; a worktree list could be read before its refresh was applied; a preview server found before its launcher started it was never scanned again; Cloud presence checks dialed the account's logical device."

[[entry]]
version = "0.3.5"
date = "Nov 14"

[[entry.features]]
id = "mission-threads"
title = "Every thread a chat hands work to, in one Threads tab"
description = "Threads is now the first tab of the right panel. It lists the delegated tasks, plan steps and chats this chat started, grouped into Ready for review, Waiting on you, Working, Planned and Done. Click a row to open that thread inside the tab and talk to it, with the chat still beside it. The composer shows N Working."
details = "A row's menu has Stop, Mark done, Skip, Reopen and Run again. Step threads no longer take a row in the sidebar."

[[entry.features]]
id = "mission-plan"
title = "Approve and edit a plan beside the chat"
description = "When an agent plans work in steps, the plan arrives as a card in the chat with Edit plan and Approve and run, and nothing starts until you approve. Edit opens the plan in the Threads tab: change the overview, rename, reorder, add or remove steps, and save them in one go."
details = "Steps that have started are locked. Any chat can hold a plan; a task linked to that chat shows its progress."

[[entry.improvements]]
text = "A thread's question goes to the chat that started it, then to you in the Waiting pill. The Supervisor, the Mission Control pages and Approve as Task are gone."

[[entry.improvements]]
text = "Delegated tasks per chat is now one limit for delegated tasks, plan steps and the chats an agent started that are still working. The separate cap of 8 open chats is gone."

[[entry.improvements]]
text = "Agents write a plan with the new plan tool, which has its own switch in Settings > Context & tools > Tools."

[[entry.improvements]]
text = "Compaction has one decider per reason: Zeron compacts an idle chat before its prompt cache expires, the agent calls compact when the work changes, and Claude Code compacts by itself when its window fills. The classifier that read each message, Jev, Compact ahead of time and the carried-over turns are gone, so a message is sent at once."

[[entry.improvements]]
text = "The Context window card marks where the agent is reminded and where the chat compacts by itself, and its Next compaction section says when the next one runs or why none is scheduled. A planned compaction also shows beside the ring in the footer."

[[entry.improvements]]
text = "Idle compaction no longer misses a Claude Code chat with background work, a chat left idle across an engine restart, or a Mac that woke late."

[[entry.improvements]]
text = "Settings > Agents > Compaction lists the three reasons with who decides each. A compaction's divider opens to what the agent asked to keep and its summary."

[[entry.improvements]]
text = "With an empty composer, Shift+Up and Shift+Down step the chat's context size along the model picker's Context slider. The context ring says the tokens in use and the new size for a moment."

[[entry.improvements]]
text = "Picking 1M on the Context slider after a smaller size now stays. It used to go back to the smaller size a few seconds later."

[[entry]]
version = "0.3.4"
date = "Nov 13"
hero = "zgx-app.jpg"
hero_visual = "text-annotation-hero"

[[entry.features]]
id = "zgx-app"
title = "Zeron runs on its new interface"
description = "Zeron.app is now built on zgx, the interface upstream Zeron ships from 0.3.0. Your chats, projects, drafts, settings and shortcuts carry over on first launch, and the engine is updated with the app."
details = "The tab bar, rail and sidebar, Sidecar, Tasks, Inbox, the Git and PR pages, the terminal, split chats, side chats and the composer's pills are all on the new interface."

[[entry.features]]
id = "message-edit"
title = "Edit a message you sent and send it again"
description = "Hover a message you sent and click Edit: it opens in place, and Send replaces it and everything after it with your new words. Rewind to here puts the message back in the composer and removes it and the turns after it. Under a reply, Fork from here opens a new chat with the history up to that reply."
details = "When the agent can't do one of these, its button is dimmed and the tooltip says why."

[[entry.features]]
id = "pdf-viewer"
title = "Read PDFs in the file viewer"
description = "A PDF on this Mac opens as its pages, fitted to the width. Zoom with the buttons or Cmd+ and Cmd-, the footer shows Page N of M, and the menu has Open in Default App and Reveal in Finder."
details = "A locked, damaged or empty PDF says why it can't open."

[[entry.features]]
id = "markdown-fence-render"
title = "Read a Markdown block as rendered text"
description = "A ```markdown code block in a reply has an eye button beside Copy. Turn it on to see the block rendered as Markdown, turn it off to see the source again."

[[entry.features]]
id = "text-annotations"
title = "Comment on any text in a reply"
description = "Select text in a reply, or in a Markdown file in the right pane, and a pill offers Add to chat and Ask in side chat. Add to chat opens a comment field; the text stays highlighted with a numbered badge and the composer shows 1 annotation. When you send, the agent gets each quote with your comment and the file it came from."
details = "Hover the chip to edit or remove one. The comment is optional. Ask in side chat opens a side chat on that text."
visual = "text-annotation"

[[entry.features]]
id = "skills-page"
title = "All your agents' skills on one page"
description = "Skills in the app rail lists every skill your agents find, with a filter per agent. Click one to read it, turn it off, or uninstall it. Try now starts a message with it, and the composer shows a picked skill as a pill."
visual = "skills-page"

[[entry.features]]
id = "worktree-follow"
title = "Threads follow the worktree their agent moves to"
description = "When an agent creates or edits a linked git worktree, its thread moves there. The composer footer reads Worktree · and the folder, the Git panel follows, and sidebar rows and tabs show how far ahead the branch is or a merged check."
details = "Click the branch in the footer to move the thread to another worktree or back to the main checkout. The agent is told on its next turn."
visual = "worktree-follow"

[[entry.features]]
id = "task-references"
title = "Menus in every task input, and tasks that wait on each other"
description = "@, $ and / work in Quick capture, the Tasks and Inbox add rows, the task card and a plan's steps. A task you pick with @ in Quick capture becomes a dependency: the new task's row says Blocked by and its title, then Depends on with a check once that task is done."
details = "Agents see and set the same dependencies through the tasks tool. A cycle or an unknown task is refused."
visual = "task-depends"

[[entry.features]]
id = "live-preview"
title = "See your running dev server in the chat"
description = "An agent can show a page from your local server as a live card in the chat. You can click around in it, reload it, or open it in your browser. If the server stops, the card says so and offers Retry."
details = "Only localhost, 127.0.0.1 and [::1] addresses. A card from another device says where the page runs."
visual = "live-preview"

[[entry.features]]
id = "window-frame"
title = "Let your artwork run under the tab bar and rail"
description = "With a background set, Window frame in Settings > Appearance takes the artwork past the chat: Off, Dark or Glass, with Frame shade and, for Glass, Frame blur. Frame sidebar puts the sidebar on the frame too: Plain, Darker or Glass."
details = "Sidebar blend chooses whether the sidebar's look covers the whole frame or fades across the tab bar."
visual = "window-frame"

[[entry.features]]
id = "project-picker"
title = "A New project picker with pins and New folder"
description = "The picker keeps your pinned and recent folders in a rail beside the browser. Create a folder in place, with git init if you want it, show hidden folders, or drop a folder from Finder. After you add it you are back in the composer."
details = "The picker and Cmd+K now fade and rise in, and fade and sink out."
visual = "project-picker"

[[entry.features]]
id = "upstream-0-2-133"
title = "From upstream Zeron: Cursor in your usage"
description = "The usage ring and Usage page read Cursor's own percentages, show Cursor, Grok and Other, and the ring follows the model you are using."

[[entry.features]]
id = "upstream-0-2-136"
title = "From upstream Zeron: quieter pull request watches, and agent tools for themes and plugins"
description = "Watching pull requests no longer runs git in every project. Agents also get tools for plugins, templates and themes, which you can turn off in Settings > Context & tools > Tools."
details = "Upstream's new interface comes with this merge as Zeron Beta. See Settings > Lab."

[[entry.features]]
id = "upstream-0-2-138"
title = "From upstream Zeron: an Activity sidebar and quieter git scans"
description = "Subagents show in the composer's Running tray, chats in a plain folder no longer ask for a worktree, and background git scans run only for the chats you are viewing."

[[entry.features]]
id = "upstream-0-3-2"
title = "From upstream Zeron: the zgx interface as the stable app"
description = "Upstream 0.3.0 to 0.3.2 make zgx the stable app: a Themes page under Customize, theme tools for agents, a command's output folded under its call with Show all lines, a + on a project's device rows, and many fixes to the sidebar, composer and transcript."

[[entry.features]]
id = "upstream-0-3-3"
title = "From upstream Zeron: pictures from a tool's result"
description = "A screenshot or image a tool returns shows as a small thumbnail when you open its row, and clicking it opens the lightbox. Finishing setup without an account now opens the main window on the next launch."
details = "macOS sound chimes no longer risk hanging the Mac, and Windows lists microphones by name."

[[entry.features]]
id = "upstream-0-3-4"
title = "From upstream Zeron: Windows terminal tabs and Codex's own commands"
description = "Terminal tabs work on Windows: they open PowerShell, follow the tab's size, and Ctrl+C stops what the shell runs. In a Codex chat, / lists Codex's commands and skills."
details = "With Reduce motion on, a switch that is on shows its knob on the right."

[[entry.improvements]]
text = "A lead agent can raise the access of a thread or subagent it started while it runs, up to its own, and what is waiting that the new mode covers is answered at once. A lead at Full access can also approve a request for the rest of that turn."

[[entry.improvements]]
text = "A new access mode, Auto: edits apply on their own, and a quick check by the chat's agent on its cheapest model lets safe commands and tools through and asks you about the rest. What it allows shows in the chat as answered by Auto."

[[entry.improvements]]
text = "On the zgx interface, your avatar sits on the rail above Settings, and the app's update shows there: an arrow falling while it downloads, a check that turns to restart when it's ready."

[[entry.improvements]]
text = "Show all and Show fewer on thoughts is one choice for every chat, kept across launches."

[[entry.improvements]]
text = "A work group's summary says consulted advisor instead of counting the advisor as a tool."

[[entry.improvements]]
text = "When the composer shows a prediction, Tab or Right arrow takes it, even while the composer isn't focused, and the two keys show beside it."

[[entry.improvements]]
text = "A shell code block in a reply has Run beside Copy: it opens a new terminal tab in the chat's folder and pastes the block there, so a tab inside it no longer reaches the shell as completion. Copy gives the block exactly as written, tabs included."

[[entry.improvements]]
text = "Settings moves to a sidebar tree: a group opens to its pages under a guide line, each page has a title and summary, and changing page crossfades. A search hit shows its path, and picking one glides to the row and flashes it."
visual = "settings-tree"

[[entry.improvements]]
text = "Compaction has its own page under Settings > Agents. Settings > Lab holds what is still being tried: Compact ahead of time, the compaction classifier, agent access and Zeron Beta."

[[entry.improvements]]
text = "Agents now reach Zeron with a limited key, so they cannot allow plugins or sign you in. In a chat below Full access, the terminal and computer tools and saving Actions are refused. If a tool you need is refused, turn on Agents use the full token in Settings > Lab."

[[entry.improvements]]
text = "A very large image opens as a downscaled preview instead of being refused, and task image strips use small thumbnails so they stop blinking."

[[entry.improvements]]
text = "Pasted, picked and dropped images show as 120 px previews in the composer, with file chips beside them."

[[entry.improvements]]
text = "Switching Appearance from Dark to System follows the OS right away."

[[entry.improvements]]
text = "An agent's compaction no longer stalls at Compaction queued when Compact ahead of time is on, and a message sent during a compaction no longer splits its divider."

[[entry.improvements]]
text = "Home under New chat is one panel, with Needs you, Running and Recent as columns. The agent updates card is back at the foot of the window."

[[entry.improvements]]
text = "The titlebar pill reads like \"1 needs you · 2 working\". Its tray says what needs you once, has Ask Supervisor in its header, and shows each running thread's agent mark and time."

[[entry.improvements]]
text = "Text past the title in the rail's quick capture goes to the task's notes instead of being dropped."

[[entry.improvements]]
text = "On iPhone, picking an @ suggestion on New thread inserts it instead of closing the list."

[[entry.improvements]]
text = "Every agent wears its provider's mark instead of a robot: a Pi or OpenCode chat shows the Pi or OpenCode mark even on a GPT model, and a subagent started on another model shows that model's maker."

[[entry.improvements]]
text = "The sidebar and rail take the tab bar's accent tint. Over a background picture, the tab bar matches the sidebar instead."

[[entry.improvements]]
text = "Deleting a chat also deletes its side chats and subagents."

[[entry.improvements]]
text = "Jump to latest and the queued pill hold their place while they fade, and the Compacting line no longer runs into the composer."

[[entry.improvements]]
text = "@ has a Folders tab after Files. A file or folder you pick stays one chip even when its name has spaces, and chats in the list show their agent's mark."

[[entry.improvements]]
text = "When a turn stopped short, the send button on an empty composer is Resume. A usage limit notice names the window that ran out, such as \"Claude Code 5-hour limit reached.\""

[[entry.improvements]]
text = "Settings opens as a panel over your chats, which stay where they were. Esc, the close button or a click outside closes it. Chat is now a section of General, History a section of Browser, and Themes a section of Appearance."

[[entry.improvements]]
text = "The pills, the side chat tab, the find bar and the other surfaces over a chat are frosted glass, so the conversation no longer shows through them."

[[entry.improvements]]
text = "The button back to the latest message is a small round arrow. While a reply is still being written below, it shows moving dots and reads New reply."

[[entry.improvements]]
text = "A tick for each of your messages runs down the chat's left edge. Hover one to preview it, click it to go there."

[[entry.improvements]]
text = "An agent can close a page of options once you have answered it, and the pill has an X to close one yourself. A closed page says Closed and takes no more picks."

[[entry.improvements]]
text = "An edit's diff in the chat shows its code in syntax colors."

[[entry.improvements]]
text = "Tabs grow open and shrink closed in every tab strip, and the tabs beside them slide into place."

[[entry.improvements]]
text = "Dragging a sidebar row lifts it as frosted glass, and one let go over nothing slides back home. A tab pulled out of its strip grows into its thumbnail, and a chat held at a pane's left or right edge shows the split cards."
visual = "tab-drag"

[[entry.improvements]]
text = "A short label cut off with an ellipsis no longer stops the app with a red error banner."

[[entry]]
version = "0.2.132"
date = "Nov 1"
hero = "answer-pill.jpg"
hero_visual = "answer-pill-hero"

[[entry.features]]
id = "answer-pill"
title = "Answer what is waiting on you from the composer"
description = "When another thread asks you something, the Supervisor needs a decision or a plan waits for approval, a \"? 2 Waiting\" pill joins the agent and shell pills above the composer. Click it for a card with one tab per item: answer the question, pick an option (number keys work) or Dismiss, or Approve the plan. The next item slides in, and the pill fades once nothing is left."
details = "Esc, a click outside or another click on the pill closes the card and keeps what you typed. On New chat the card opens below the pill. The titlebar pill and the Cmd+I tray now hold what is running, failed threads and Task rows; on New chat the Needs you card's Answer and Review buttons open the same card."
visual = "answer-pill"

[[entry.features]]
id = "keep-awake"
title = "Your Mac stays awake while agents work"
description = "While an agent on this Mac is working, Zeron keeps the Mac from sleeping, and lets it sleep again a minute after the last one stops. Turn it off in Settings > General, under Power, with Keep this Mac awake while agents work."
details = "The display can still turn off; only system sleep is held back."
visual = "keep-awake"

[[entry.features]]
id = "upstream-0-2-131"
title = "From upstream Zeron: background processes"
description = "Shells an agent leaves running, from Claude Code or Codex, show in the shells pill above the composer. Open one to read its output as it arrives, copy it, or stop it."
details = "Streaming chats no longer leak memory."

[[entry.improvements]]
text = "The agents and shells pills are back above the composer and read like \"2 Working · ✓ 1 Done\". The agents pill also lists running forks, side chats and threads an agent started, and the ones this turn started stay listed with a Done mark after they finish."

[[entry.improvements]]
text = "An agent's detail in the agents pill reads like the chat: grouped tool rows, a folded Thought process and formatted replies, instead of raw labels and JSON."

[[entry.improvements]]
text = "The titlebar pill shows the marks of the agents that are running with \"2 Working\", then an icon and \"1 Asking\", \"1 Failed\" or \"1 Need you\". Cmd+I is in its tooltip."

[[entry.improvements]]
text = "Subagents wear their provider's mark instead of a robot."

[[entry.improvements]]
text = "Compaction is one centered divider, and Compacting turns into Compacted in place instead of swapping cards. The composer chip shows the same spinner and words."
visual = "compaction-morph"

[[entry.improvements]]
text = "A two-finger swipe back or forward slides a round button in from the edge. Its arrow darkens once letting go will move, and on release it shrinks to a dot and disappears."
visual = "swipe-dot"

[[entry.improvements]]
text = "The Usage page lines its cards up under the title in two columns, and Extra Usage that is off takes one quiet line."

[[entry.improvements]]
text = "Dragging a tab moves the tab itself along the strip, the way Chrome does. Pull it below the strip and it becomes a thumbnail while a split card slides in from each edge, white on light themes and black on dark; drop it on one to split."
visual = "tab-drag"

[[entry.improvements]]
text = "A file over 24 MB is linked by its path instead of refused. Its chip shows the size and a link mark, and the agent opens the file where it is."

[[entry.improvements]]
text = "Mark chats read on the Needs you card, the Cmd+I tray and the sidebar Inbox header clears unread chats in one click."

[[entry.improvements]]
text = "Settings opens and closes at once, without a fade. Its search finds the controls the new layout had hidden from it, such as Compaction, Predictions, Chat and Terminal background, Glass tint, Tools, Routing and Code review, and a hovered result highlights as a rounded row."

[[entry.improvements]]
text = "The Side chat tab and Cmd+; hide the side chat when it is already showing, and the side chat pane paints the chat background."

[[entry.improvements]]
text = "On iPhone, HTML pages load in parallel chunks and say why a page failed, and /usage opens the Usage page."

[[entry]]
version = "0.2.131"
date = "Oct 31"
hero_visual = "triage-tray"

[[entry.features]]
id = "triage-tray"
title = "One place for what needs you: the Cmd+I tray"
description = "The pill on the right of the titlebar counts the threads that need you and the ones running, like \"2 need you · 1 running\". Click it or press Cmd+I for the tray: answer a question, review a plan, or open a failed thread, and stay in the chat you are in. Its top row opens the Supervisor, and History and Tasks sit at its foot."
details = "The tray takes over from the ask pill above the composer, the Supervisor rail button and the Tasks Needs you chip; the bell now opens History only. Change the shortcut in Settings > General > Shortcuts, under Needs you and running."
visual = "triage-tray"

[[entry.features]]
id = "new-chat-cards"
title = "New chat shows what needs you, what is running and what you did last"
description = "The rail's top button is New chat, and Cmd+N opens it from anywhere, a chat included. Under its composer, with the project chip and the Plan switch, three cards list the threads that need you (answer them right there), the ones running, and your recent chats."
details = "The cards replace the Chat and Work toggle, the New task, Mission Control and Running agents tabs, and the Working now, Missions and Recent areas widgets. With one device, New project opens straight on its folders."
visual = "new-chat-cards"

[[entry.features]]
id = "plan-approve-task"
title = "Approve a plan here, or as a Task"
description = "Turn on Plan in the composer (Shift+Tab) and Claude writes a plan before it changes anything; Send reads Start plan. The plan arrives as a card with its steps. Approve runs it in this chat, Approve as Task tracks its steps in Tasks with Open in Tasks, and Edit plan tells the agent to change it."
details = "The tray offers the same Approve and Approve as Task. On Codex and OpenCode the Plan switch has the agent write a plan and change nothing, with no approval step. Approve as Task is greyed out, with the reason, when the chat cannot become a Task."
visual = "plan-approve-task"

[[entry.features]]
id = "child-pane-tabs"
title = "Agents, forks and side chats open beside the chat"
description = "Every child thread (an agent, a delegated task, a fork, a side chat, a thread an agent started) opens as a tab in the right pane with a badge for its kind, from whichever door you use. Hover a reply and click Fork to fork through it into a tab. The Side chat ⌘; tab on the composer, Cmd+; or /btw opens a side chat there."
details = "When tabs run out of room they shrink to their badges, then a ⋯ N menu holds the rest. The btw strip above the composer is gone, and child threads are listed in the Sidecar under Beside this thread instead of the sidebar; Cmd+K search still finds them."
visual = "child-pane-tabs"

[[entry.improvements]]
text = "The composer has a model chip and an access chip on New chat and in every chat, in the same spot. The model card no longer holds the permissions, and the access card no longer has a plan row: Plan is the one switch in the composer."

[[entry.improvements]]
text = "The Sidecar has three sections: Workspace (the branch and how far it is ahead of main), Beside this thread (agents, side chats, forks, started threads, shells, the Task row and Stop all) and Actions. With a pane tab open it folds to a 40px rail. The Working pill above the composer is gone; its agents and shells are in Beside this thread."

[[entry.improvements]]
text = "Changes, Files and Browser are tool tabs in the right pane, opened from the titlebar's pane button with the diff counts. Review and its findings sit in Changes, beside the Uncommitted and History switch."

[[entry.improvements]]
text = "Cmd+J only opens and closes the bottom dock, and the right pane's terminal moved into it. Project actions run from the Sidecar's Actions as dock tabs named after the action, and their row turns Done or Failed when the command ends while the shell stays open."

[[entry.improvements]]
text = "Usage lives in the rail ring and the Usage page. Hover the ring for each account's windows and click it for the page. At a limit the ring turns red and one notice in the composer offers Switch model (or a switch to a named model), Wait for reset or Cancel. /usage opens the page, and switching accounts is on its plan cards."

[[entry.improvements]]
text = "A new install opens on one three-step setup (Welcome, Your agents, Done). Later launches show at most this What's New card, and when several releases came out since you last looked it opens each of them."

[[entry.improvements]]
text = "Settings has eight sections plus Account, where Enable sync and Sign out now live. Search shows each result's section path, and Appearance keeps its look-only controls under Advanced look. Light and dark are set only in Settings > Appearance."

[[entry.improvements]]
text = "Star Zeron on GitHub and Agent updates are rows in the Help menu, in place of the Star banner and the agent updates card on New chat."

[[entry.improvements]]
text = "Fewer doors: the Supervisor rail button moved to the tray's top row and Cmd+K, the Usage rail button to the ring, the rail avatar to Settings > Account, the ask pill to the tray, and the btw strip to side chat tabs in the right pane. Inbox is history, and Mission Control labels read Plan or Tasks."

[[entry.improvements]]
text = "A thread that leads a Task reads \"Task · step 2 of 3\" in the sidebar instead of a bare count."

[[entry.improvements]]
text = "Claude Code's /config panel keeps Status, Config and Stats; its Usage tab is gone, since plan usage lives on the ring and the Usage page."

[[entry.improvements]]
text = "A failed update check says why in words, and names a firewall such as Little Snitch when one dropped the connection, instead of \"Bad file descriptor (os error 9)\"."

