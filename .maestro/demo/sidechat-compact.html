<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zeron demo: /compact and /sidechat</title>
<style>
  :root {
    --bg: #131313; --panel: #171717; --surface: #1f1f1f; --surface-2: #262626;
    --border: #2b2b2b; --text: #ececec; --muted: #9a9a9a; --dim: #6b6b6b;
    --accent: #e8a27a; --pink: #f08cc2; --pink-bg: #3a1f2e; --ok: #7fd0a0; --warn: #e6b45c; --danger: #ef7a7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; }
  .topbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .topbar .title { font-weight: 600; margin-right: 12px; }
  .tab { padding: 6px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; border: 1px solid transparent; }
  .tab.active { color: var(--text); background: var(--surface-2); border-color: var(--border); }
  .steps { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #e9e9e9; color: #111; border-color: #e9e9e9; }
  .app { display: grid; grid-template-columns: 220px 1fr 0px; height: calc(100vh - 49px); transition: grid-template-columns .45s cubic-bezier(.2,.8,.2,1); }
  .app.with-right { grid-template-columns: 220px 1fr 420px; }
  .right { overflow: hidden; min-width: 0; }
  .right .inner { width: 420px; height: 100%; display: flex; flex-direction: column; }
  .quiet .main .user, .quiet .main .assistant, .quiet .main .popup { animation: none; }
  .sidebar { border-right: 1px solid var(--border); background: var(--panel); padding: 12px 8px; font-size: 13px; }
  .sidebar .h { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; }
  .chat-row { padding: 6px 8px; border-radius: 6px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .chat-row.active { background: var(--surface-2); color: var(--text); }
  .chat-row.nested { padding-left: 22px; }
  .chat-row .arrow { color: var(--dim); }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .transcript { flex: 1; overflow: auto; padding: 28px 40px 12px; display: flex; flex-direction: column; gap: 22px; }
  .user { align-self: flex-end; background: var(--surface-2); border-radius: 18px; padding: 10px 18px; max-width: 70%; }
  .assistant { max-width: 78%; }
  code.hl { background: var(--pink-bg); color: var(--pink); padding: 1px 6px; border-radius: 6px; font: 14px/1 ui-monospace, Menlo, monospace; }
  .group { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--text); }
  .chip .ic { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); border-top-color: transparent; animation: spin 1s linear infinite; }
  .chip.done .ic { border: none; width: auto; height: auto; animation: none; color: var(--ok); }
  .trailer { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .trailer .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; margin: 6px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .divider b { color: var(--text); font-weight: 500; }
  .composer-wrap { padding: 8px 40px 14px; position: relative; }
  .popup { position: absolute; left: 40px; right: 40px; bottom: 96px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .popup .row { display: flex; gap: 12px; align-items: baseline; padding: 8px 12px; border-radius: 8px; }
  .popup .row.sel { background: var(--surface-2); }
  .popup .row .n { font-weight: 600; min-width: 110px; }
  .popup .row .d { color: var(--muted); font-size: 13px; flex: 1; }
  .popup .row .tag { font-size: 10.5px; color: var(--dim); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .popup .row.off { opacity: .5; }
  .composer { border: 1px solid var(--border); border-radius: 22px; background: var(--surface); padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .composer .clip { color: var(--muted); }
  .composer .input { flex: 1; font-size: 17px; min-height: 26px; }
  .composer .input .caret { display: inline-block; width: 2px; height: 20px; background: var(--pink); vertical-align: -3px; }
  .composer .model { color: var(--muted); font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .composer .model b { color: var(--text); font-weight: 600; }
  .composer .send { width: 36px; height: 36px; border-radius: 50%; background: #e9e9e9; color: #111; display: grid; place-items: center; font-weight: 700; }
  .composer.busy { opacity: .85; }
  .composer .status { color: var(--muted); font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .footer { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 14px; padding: 8px 6px 0; }
  .footer .meter { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; cursor: pointer; }
  .ring { width: 16px; height: 16px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), #333 0); position: relative; }
  .ring::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg); }
  .card { position: absolute; right: 0; bottom: 28px; width: 250px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 13px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: none; z-index: 2; }
  .meter:hover .card, .meter.pinned .card { display: block; }
  .card .kv { display: flex; justify-content: space-between; color: var(--muted); margin: 2px 0; }
  .card .kv b { color: var(--text); font-weight: 500; }
  .card button { width: 100%; margin-top: 10px; font-size: 13px; }
  .card .why { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .pill { display: inline-flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .pill .st { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .pill .st.live { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .right { border-left: 1px solid var(--border); background: var(--panel); }
  .right .tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .right .tabs .t { padding: 4px 10px; border-radius: 6px; color: var(--muted); }
  .right .tabs .t.active { background: var(--surface-2); color: var(--text); }
  .right .tabs .x { margin-left: auto; color: var(--muted); cursor: pointer; padding: 4px 8px; }
  .right .transcript { padding: 18px 18px 8px; gap: 16px; font-size: 14px; }
  .right .composer-wrap { padding: 8px 12px 12px; }
  .right .composer { padding: 8px 12px; }
  .right .composer .input { font-size: 15px; }
  .picker { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 40px; }
  .picker .row { display: flex; gap: 12px; align-items: center; border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; font-size: 16px; background: #141414; cursor: pointer; }
  .picker .row .ic { color: var(--muted); width: 18px; text-align: center; }
  .picker .row.new { border-color: #3a3a3a; }
  .picker .row.new .tag { margin-left: auto; font-size: 10.5px; color: var(--dim); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
  .picker .row.target { animation: hl .5s ease-out 1.5s both; }
  @keyframes hl { 0% { background: #141414; } 50% { background: var(--surface-2); transform: scale(.985); } 100% { background: var(--surface-2); } }
  .sysnote { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 12px; color: var(--muted); font-size: 12.5px; }
  .sysnote b { color: var(--text); font-weight: 500; }
  .notice { position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 13px; color: var(--text); }
  .legend { position: fixed; right: 16px; top: 58px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); max-width: 320px; z-index: 5; }
  .legend b { color: var(--text); }
  .hidden { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.85); } 60% { transform: scale(1.04); } 100% { opacity: 1; transform: none; } }
  @keyframes slide { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes widen { from { letter-spacing: -.2em; opacity: 0; } to { letter-spacing: 0; opacity: 1; } }
  .anim .user, .anim .assistant, .anim .sysnote { animation: rise .35s ease-out both; }
  .anim .popup { animation: pop .25s ease-out both; }
  .anim .chip, .anim .pill { animation: pop .3s ease-out both; }
  .anim .divider { animation: rise .45s ease-out both; }
  .anim .divider b { animation: widen .6s ease-out both; animation-delay: .2s; }
  .anim .right .transcript, .anim .right .composer-wrap { animation: slide .4s cubic-bezier(.2,.8,.2,1) both; }
  .anim .right .picker { animation: rise .3s ease-out both; }
  .anim .chat-row.nested { animation: rise .35s ease-out both; }
  .playing .steps button.step { display: none; }
  .btn-play.on { background: var(--accent); color: #111; border-color: var(--accent); }
</style>
</head>
<body>
<div class="topbar">
  <span class="title">Zeron demo</span>
  <span class="tab active" data-scene="compact" onclick="scene('compact')">/compact</span>
  <span class="tab" data-scene="sidechat" onclick="scene('sidechat')">/sidechat</span>
  <span class="tab" data-scene="cursor" onclick="scene('cursor')">/compact on Cursor</span>
  <div class="steps">
    <span id="stepLabel"></span>
    <button class="step" onclick="prev()">Back</button>
    <button class="step primary" onclick="next()">Next step</button>
    <button class="btn-play" id="btnPlay" onclick="togglePlay()">▶ Play</button>
    <button onclick="playAll()">▶ Play all</button>
  </div>
</div>
<div class="legend" id="legend"></div>
<div class="app" id="app"></div>

<script>
const scenes = {
  compact: {
    steps: [
      { label: '1/5 · chat at 78%', legend: '<b>Trước khi compact.</b> Chat Claude đã dài; meter ở góc composer báo 78%. Hover vào meter để thấy hover card với nút Compact context (d8).' },
      { label: '2/5 · type /compact', legend: '<b>Gõ /compact.</b> Popup slash liệt kê lệnh app-level của Zeron (tag Zeron) bên cạnh lệnh harness quảng bá; trùng tên thì chỉ hiện một dòng. Có thể thêm focus: <i>/compact focus on auth</i>.' },
      { label: '3/5 · compacting', legend: '<b>Gửi.</b> Composer chặn lệnh, không tạo bubble user. Transcript hiện chip phẳng "Compacting context" giống chip Advisor, trailer "Compacting context…", composer khóa với trạng thái Compacting…, nút meter disabled. Engine giữ một compaction pending, timeout 2 phút.' },
      { label: '4/5 · boundary', legend: '<b>Xong.</b> Chip đổi thành dòng boundary role=system "Context compacted · 84k → 12k". Lịch sử phía trên giữ nguyên, meter reset về 6%. Entry này sync sang edge/iOS như entry thường (d5).' },
      { label: '5/5 · continue', legend: '<b>Tiếp tục.</b> Turn kế tiếp resume cùng session, giờ đã nhẹ. Nếu harness trả "Not enough messages to compact", chỉ hiện notice, không có boundary, meter không đổi.' },
    ],
    render(s) {
      const pct = s >= 3 ? 6 : 78;
      const col = pct >= 90 ? 'var(--danger)' : pct >= 75 ? 'var(--warn)' : 'var(--ok)';
      return `
      ${sidebar('Fix bug X', false)}
      <div class="main">
        <div class="transcript">
          <div class="user">Hello</div>
          <div class="assistant">Hello Reina. I'm in <code class="hl">~/Code/zeron-fork</code> on <code class="hl">main</code>, with untracked <code class="hl">.maestro/</code> and <code class="hl">docs/research/sidebar-redesign/</code>. What are we working on?</div>
          <div class="user">Fix the tab strip regression in shell.rs</div>
          <div class="assistant">
            <div class="group"><span class="chip"><span style="color:var(--muted)">⌘</span> Ran 6 commands</span><span class="chip">Read 4 files</span><span class="chip done"><span class="ic">✓</span> Advisor</span></div>
            <p style="margin:10px 0 0">Root cause: <code class="hl">tabs.rs</code> dropped the strip when the sidebar was collapsed. I restored it behind the existing sidebar flag and the suite is green.</p>
          </div>
          ${s === 2 ? `<div class="assistant"><div class="group"><span class="chip"><span class="ic"></span> Compacting context</span></div><div class="trailer" style="margin-top:10px"><span class="dot"></span> Compacting context…</div></div>` : ''}
          ${s >= 3 ? `<div class="divider"><span>Context compacted · <b>84k → 12k</b> · 4s</span></div>` : ''}
          ${s >= 4 ? `<div class="user">Now do the same for the composer dock</div><div class="assistant"><div class="group"><span class="chip">Read 2 files</span></div><p style="margin:10px 0 0">The dock uses the same collapse flag; patching…</p></div>` : ''}
        </div>
        <div class="composer-wrap">
          ${s === 1 ? `<div class="popup">
            <div class="row sel"><span class="n">/compact</span><span class="d">Free up context by summarizing the conversation · optional focus</span><span class="tag">Zeron</span></div>
            <div class="row"><span class="n">/sidechat</span><span class="d">Ask about this chat on the side, without touching it</span><span class="tag">Zeron</span></div>
            <div class="row"><span class="n">/code-review</span><span class="d">Review the current diff</span></div>
            <div class="row"><span class="n">/context</span><span class="d">Visualize current context usage</span></div>
          </div>` : ''}
          ${composer(s === 1 ? '/compact' : (s === 4 ? '' : ''), s === 2 ? 'Compacting…' : null)}
          ${footer(pct, col, s === 2, 'Fable 5.1 · 200k window', s === 2 ? 'Compaction in progress' : null)}
        </div>
      </div>`;
    }
  },
  cursor: {
    steps: [
      { label: '1/2 · Cursor chat', legend: '<b>Harness không hỗ trợ.</b> Cursor không có compaction (và không báo context usage). Lệnh vẫn nằm trong popup nhưng xám kèm lý do (d8).' },
      { label: '2/2 · meter card', legend: '<b>Hover card.</b> Nút Compact context cũng disabled với cùng lý do; không ẩn để người dùng hiểu vì sao.' },
    ],
    render(s) {
      return `
      ${sidebar('Cursor: refactor auth', false)}
      <div class="main">
        <div class="transcript">
          <div class="user">Refactor the auth middleware</div>
          <div class="assistant"><div class="group"><span class="chip">Read 3 files</span></div><p style="margin:10px 0 0">Plan: split <code class="hl">auth.rs</code> into token parsing and policy…</p></div>
        </div>
        <div class="composer-wrap">
          ${s === 0 ? `<div class="popup">
            <div class="row sel off"><span class="n">/compact</span><span class="d">Cursor does not support compaction</span><span class="tag">Zeron</span></div>
            <div class="row"><span class="n">/sidechat</span><span class="d">Ask about this chat on the side, without touching it</span><span class="tag">Zeron</span></div>
          </div>` : ''}
          ${composer(s === 0 ? '/compact' : '', null)}
          ${footer(null, 'var(--dim)', true, 'Cursor · composer-1', 'Cursor does not support compaction', s === 1)}
        </div>
      </div>`;
    }
  },
  sidechat: {
    steps: [
      { label: '1/6 · right pane picker', legend: '<b>Picker của right pane</b> (RightSurface::Picker) có thêm mục <b>Sidechat</b> bên dưới Files / Browser / Terminal / Diffs / History. Chọn nó mở sidechat gần nhất của chat này, chưa có thì tạo mới. Có sẵn khi chat nguồn đang chạy.' },
      { label: '2/6 · sidechat tab opens', legend: '<b>Tab Sidechat mở ngay trong pane</b> (khung SubagentTab + composer riêng). Nó là Chat thật, sidebar lồng nó dưới chat nguồn (d2). Dòng ghi chú cho biết đã copy gì làm context. Gõ câu hỏi vào composer của pane.' },
      { label: '3/6 · answer', legend: '<b>Trả lời.</b> Turn đầu gửi boundary + copy text giới hạn của nguồn. Sidechat kế thừa model, sandbox, auto-approve của nguồn (d3); đổi model ở đây không ảnh hưởng nguồn. Chat nguồn: transcript, resume pointer, meter không đổi.' },
      { label: '4/6 · close tab', legend: '<b>Đóng tab</b>: pane quay về picker, sidechat vẫn nằm trong sidebar; composer nguồn hiện pill "Sidechat" để mở lại (astra 31a1c3213).' },
      { label: '5/6 · reopen', legend: '<b>Mở lại từ pill, sidebar, hoặc picker.</b> Các turn sau resume session riêng của sidechat, chỉ kèm boundary, không copy lại. Sidechat không mở được sidechat lồng.' },
      { label: '6/7 · bare /sidechat', legend: '<b>Đường thứ hai: gõ /sidechat</b> trong composer chat nguồn. Không kèm prompt thì chỉ mở tab Sidechat trong pane với composer trống, y như chọn từ picker. Lệnh app-level, có trên mọi harness, chặn trong send() trước nhánh busy.' },
      { label: '7/7 · /sidechat [prompt]', legend: '<b>/sidechat compare the two options</b>: mở cùng tab và gửi prompt ngay, turn đầu bắt đầu luôn. Cả hai đường đều dùng chung tab Sidechat của pane.' },
    ],
    render(s) {
      const tabOpen = s === 1 || s === 2 || s === 4 || s === 6;
      return `
      ${sidebar('Fix bug X', s >= 1)}
      <div class="main">
        <div class="transcript">
          <div class="user">Fix the tab strip regression in shell.rs</div>
          <div class="assistant">
            <div class="group"><span class="chip">Ran 6 commands</span><span class="chip">Read 4 files</span></div>
            <p style="margin:10px 0 0">Root cause: <code class="hl">tabs.rs</code> dropped the strip when the sidebar was collapsed. Two options: restore behind the sidebar flag, or move the strip into the titlebar. I went with the flag.</p>
          </div>
          <div class="assistant"><div class="trailer"><span class="dot"></span> Running tests…</div></div>
        </div>
        <div class="composer-wrap">
          ${s === 5 ? `<div class="popup">
            <div class="row sel"><span class="n">/sidechat</span><span class="d">Ask about this chat on the side, without touching it · [prompt]</span><span class="tag">Zeron</span></div>
            <div class="row"><span class="n">/compact</span><span class="d">Free up context by summarizing the conversation</span><span class="tag">Zeron</span></div>
          </div>` : ''}
          ${composer(s === 5 ? '/sidechat' : (s === 6 ? '/sidechat compare the two options' : ''), null)}
          <div class="footer"><span>▢ Local checkout</span><span>⑂ main</span>
            ${s >= 3 && s <= 4 ? `<span class="pill" onclick="go(4)"><span class="st ${s === 3 ? 'live' : ''}"></span> Sidechat: compare the two options</span>` : ''}
            <span class="meter"><span class="ring" style="--p:24;--c:var(--ok)"></span> 24%</span></div>
        </div>
      </div>
      <div class="right"><div class="inner">
        <div class="tabs"><span class="t ${tabOpen ? '' : 'active'}">Picker</span>${tabOpen ? `<span class="t active">Sidechat</span><span class="x" onclick="go(3)">✕</span>` : ''}</div>
        ${tabOpen ? `<div class="transcript">
          <div class="sysnote">Sidechat of <b>Fix bug X</b> · copied 6 messages (12k chars) as reference-only context · no tool output · boundary applied every turn</div>
          ${s === 6 ? `<div class="user">compare the two options</div><div class="assistant"><div class="trailer"><span class="dot"></span> Thinking…</div></div>` : ''}
          ${s >= 2 && s <= 4 ? `<div class="user">compare the two options</div>` : ''}
          ${s >= 2 && s <= 4 ? `<div class="assistant"><p style="margin:0"><b>Flag restore</b> keeps one code path and matches the existing collapse behaviour. <b>Titlebar move</b> frees vertical space but changes hit targets on macOS and needs the traffic-light inset recomputed.</p><p style="margin:8px 0 0">Given the regression was a flag slip, restore is the smaller fix; the titlebar move is a separate design.</p></div>` : ''}
          ${s >= 4 ? `<div class="user">what would the titlebar move touch?</div><div class="assistant"><div class="trailer"><span class="dot"></span> Thinking…</div></div>` : ''}
        </div>
        <div class="composer-wrap">
          <div class="composer"><span class="clip">⊕</span><span class="input">${s === 1 ? 'compare the two options<span class="caret"></span>' : '<span style="color:var(--dim)">Message sidechat…</span>'}</span><span class="model"><b>Fable 5.1</b> High</span><span class="send">↑</span></div>
        </div>` : `<div class="picker">
          <div class="row"><span class="ic">▢</span> Files</div>
          <div class="row"><span class="ic">◍</span> Browser</div>
          <div class="row"><span class="ic">▤</span> Terminal</div>
          <div class="row"><span class="ic">≡</span> Diffs</div>
          <div class="row"><span class="ic">⑂</span> History</div>
          <div class="row new ${s === 0 ? 'target' : ''}" onclick="go(1)"><span class="ic">◐</span> Sidechat <span class="tag">new</span></div>
        </div>`}
      </div></div>`;
    }
  }
};

function sidebar(active, nested) {
  return `<div class="sidebar">
    <div class="h">By project · zeron-fork</div>
    <div class="chat-row ${active === 'Fix bug X' ? 'active' : ''}">Fix bug X</div>
    ${nested ? `<div class="chat-row nested"><span class="arrow">↳</span> Sidechat: compare the two…</div>` : ''}
    <div class="chat-row ${active.startsWith('Cursor') ? 'active' : ''}">Cursor: refactor auth</div>
    <div class="chat-row">Sidebar redesign research</div>
    <div class="chat-row">Release v0.2.71</div>
  </div>`;
}
function composer(text, status) {
  if (status) return `<div class="composer busy"><span class="clip">⊕</span><span class="status"><span class="chip"><span class="ic"></span> ${status}</span></span><span class="model"><b>Fable 5.1</b> High · 200K</span><span class="send" style="opacity:.4">↑</span></div>`;
  return `<div class="composer"><span class="clip">⊕</span><span class="input">${text ? text : '<span style="color:var(--dim)">Message…</span>'}<span class="caret"></span></span><span class="model"><span style="color:var(--accent)">✳</span> <b>Fable 5.1</b> High · 200K</span><span class="send">↑</span></div>`;
}
function footer(pct, col, disabled, model, why, pinned) {
  const usage = pct === null ? 'Context usage not reported by this harness yet' : `${Math.round(pct * 2000).toLocaleString()} / 200,000 tokens`;
  return `<div class="footer"><span>▢ Local checkout</span><span>⑂ main</span>
    <span class="meter ${pinned ? 'pinned' : ''}"><span class="ring" style="--p:${pct ?? 0};--c:${col}"></span> ${pct === null ? '—' : pct + '%'}
      <div class="card">
        <div class="kv"><span>${model}</span></div>
        <div class="kv"><span>Used</span><b>${usage}</b></div>
        ${pct !== null ? `<div class="kv"><span>Remaining</span><b>${(200000 - pct * 2000).toLocaleString()} tokens</b></div>` : ''}
        <button ${disabled ? 'disabled' : ''} onclick="event.stopPropagation(); if(current==='compact') go(2)">⤓ Compact context</button>
        ${why ? `<div class="why">${why}</div>` : ''}
      </div></span></div>`;
}

let current = 'compact', step = 0, playing = false, timer = null, chain = null;
function scene(name) { stopPlay(); current = name; step = 0; draw(); }
function go(n) { stopPlay(); step = n; draw(); }
function next() { stopPlay(); step = Math.min(step + 1, scenes[current].steps.length - 1); draw(); }
function prev() { stopPlay(); step = Math.max(step - 1, 0); draw(); }

// Per-step timings for auto-play: how long a step stays before the next one.
const dwell = {
  compact: [1800, 2600, 3200, 3000, 3200],
  sidechat: [2600, 3200, 3200, 2600, 3000, 2600, 3200],
  cursor: [2600, 2600],
};

function draw() {
  const sc = scenes[current];
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.scene === current));
  const app = document.getElementById('app');
  // The right pane stays open through the sidechat scene; only its content
  // changes (picker -> tab -> picker), so the main transcript stays put.
  app.className = 'app anim'
    + (current === 'sidechat' ? ' with-right' : '')
    + (current === 'sidechat' && step !== 5 ? ' quiet' : '');
  app.innerHTML = sc.render(step);
  document.getElementById('stepLabel').textContent = sc.steps[step].label;
  document.getElementById('legend').innerHTML = sc.steps[step].legend;
  document.body.classList.toggle('playing', playing);
  document.getElementById('btnPlay').classList.toggle('on', playing);
  document.getElementById('btnPlay').textContent = playing ? '■ Stop' : '▶ Play';
  afterDraw();
}

// Live effects layered on top of the static step: typing into the composer,
// the meter ring draining after compaction, the meter card pinned on Cursor.
function afterDraw() {
  document.querySelectorAll('.composer .input').forEach(input => {
    if (input.querySelector('.caret') && input.textContent.trim() && !input.textContent.startsWith('Message')) typeInto(input);
  });
  if (current === 'compact' && step === 3) animateRing(78, 6);
}
function typeInto(el) {
  const caret = el.querySelector('.caret');
  const full = el.textContent.replace(/\s+$/, '');
  el.textContent = '';
  el.appendChild(caret);
  const popup = document.querySelector('.popup');
  if (popup) popup.style.visibility = 'hidden';
  let i = 0;
  const tick = () => {
    if (el.querySelector('.caret') !== caret) return;
    el.insertBefore(document.createTextNode(full[i]), caret);
    i += 1;
    if (i === 1 && popup) popup.style.visibility = 'visible';
    if (i < full.length) setTimeout(tick, 42 + Math.random() * 40);
  };
  tick();
}
function animateRing(from, to) {
  const ring = document.querySelector('.main .meter .ring');
  const label = ring && ring.nextSibling;
  if (!ring) return;
  const start = performance.now(), dur = 900;
  const frame = now => {
    const t = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - t, 3);
    const p = Math.round(from + (to - from) * e);
    ring.style.setProperty('--p', p);
    ring.style.setProperty('--c', p >= 75 ? 'var(--warn)' : 'var(--ok)');
    if (label) label.textContent = ' ' + p + '%';
    if (t < 1) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function togglePlay() { playing ? stopPlay() : startPlay(); }
function startPlay(onDone) {
  playing = true; step = 0; draw();
  const run = () => {
    timer = setTimeout(() => {
      if (!playing) return;
      if (step < scenes[current].steps.length - 1) { step += 1; draw(); run(); }
      else if (onDone) onDone(); else stopPlay();
    }, dwell[current][step]);
  };
  run();
}
function stopPlay() { playing = false; chain = null; clearTimeout(timer); timer = null; draw(); }
function playAll() {
  const order = ['compact', 'sidechat', 'cursor'];
  let i = 0;
  const nextScene = () => {
    if (i >= order.length) { stopPlay(); return; }
    current = order[i++]; startPlay(() => setTimeout(nextScene, 1200));
  };
  stopPlay(); nextScene();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
// Open with ?scene=sidechat to start on a scene; #play auto-runs it, #playall runs all three.
const wanted = new URLSearchParams(location.search).get('scene');
if (wanted && scenes[wanted]) current = wanted;
draw();
if (location.hash === '#playall') playAll();
else if (location.hash === '#play') startPlay();
</script>
</body>
</html>
